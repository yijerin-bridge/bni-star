<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회의록 상세 — BNI STAR Portal</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/portal/css/portal.css">
  <style>
    /* ── 참석자 ── */
    .attendee-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:10px; }
    .att-actions { display:flex;gap:6px; }
    .attendee-grid { display:flex;flex-wrap:wrap;gap:6px; }
    .att-btn {
      padding:4px 11px;border-radius:20px;border:1.5px solid var(--border);
      background:#f9fafb;cursor:pointer;font-size:12px;font-weight:500;
      color:#6b7280;transition:all .12s;white-space:nowrap;
    }
    .att-btn:hover { border-color:#d1d5db;background:#f3f4f6; }
    .att-btn.on  { border-color:#2563eb;background:#eff6ff;color:#1d4ed8;font-weight:600; }

    /* ── 회의록 콘텐츠 탭 ── */
    .content-tab-bar { display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:16px; }
    .ctab {
      padding:8px 18px;font-size:13px;font-weight:500;color:var(--text-muted);
      cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;
      background:none;border-top:none;border-left:none;border-right:none;transition:all .15s;
    }
    .ctab.active { color:var(--red);border-bottom-color:var(--red);font-weight:700; }
    .content-panel { display:none; }
    .content-panel.active { display:block; }
    .minutes-area { min-height:240px;resize:vertical; }

    /* ── 녹음 ── */
    .rec-area { display:flex;flex-direction:column;align-items:center;gap:16px;padding:32px 0; }
    .rec-btn {
      width:72px;height:72px;border-radius:50%;border:none;cursor:pointer;
      font-size:28px;display:flex;align-items:center;justify-content:center;
      background:#fee2e2;transition:all .2s;
    }
    .rec-btn.recording { background:#CC0000;animation:pulse 1.2s infinite; }
    .rec-timer { font-size:28px;font-weight:700;color:#374151;font-variant-numeric:tabular-nums;letter-spacing:.05em; }
    .rec-status { font-size:13px;color:#9ca3af; }
    @keyframes pulse { 0%,100%{transform:scale(1)}50%{transform:scale(1.1)} }
    audio { width:100%;border-radius:8px;margin-top:4px; }
    .rec-note { width:100%; }

    /* ── 업로드 ── */
    .upload-drop {
      border:2px dashed var(--border);border-radius:12px;padding:40px;text-align:center;
      color:#9ca3af;cursor:pointer;transition:border-color .15s;
    }
    .upload-drop:hover,.upload-drop.drag { border-color:#2563eb;color:#2563eb; }
    .upload-preview { margin-top:12px; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/members-data.js"></script>
<script src="/portal/js/portal-auth.js"></script>
<script src="/portal/js/portal-nav.js"></script>
<script>
const TYPE_LABEL = { weekly_bni:'주간회의', board:'의장단', membership:'멤버십위원회', leader_team:'리더팀' };
let meeting = null, minutesData = null;
let allMembers = [], attendedSet = new Set();
let mediaRecorder = null, recChunks = [], recBlob = null, recTimer = null, recSec = 0;
let uploadFile = null;
let activeContentTab = 'text'; // text | record | upload

document.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(location.search);
  const meetingId = params.get('id');
  if (!meetingId) { location.href = '/portal/meetings.html'; return; }

  const layout = renderPortalLayout({ title: '회의록 상세' });
  if (!layout) return;
  const { session, bodyEl } = layout;

  bodyEl.innerHTML = '<div style="text-align:center;padding:48px;color:#9ca3af">불러오는 중...</div>';

  const [mRes, minRes, memRes, attRes] = await Promise.all([
    getSb().from('meetings').select('*').eq('id', meetingId).single(),
    getSb().from('meeting_minutes').select('*').eq('meeting_id', meetingId).single(),
    getSb().from('members').select('id,legacy_id,name,company').eq('is_active', true).order('name'),
    getSb().from('meeting_attendees').select('*').eq('meeting_id', meetingId),
  ]);

  if (mRes.error) { bodyEl.innerHTML = '<div class="alert-banner crit">회의를 찾을 수 없습니다</div>'; return; }
  meeting    = mRes.data;
  minutesData = minRes.data;

  allMembers = (memRes.data?.length ? memRes.data : (loadMembers?.() || [])).map(m => ({
    id: m.legacy_id ?? m.id, name: m.name, company: m.company,
  }));
  attendedSet = new Set((attRes.data || []).filter(a => a.attended).map(a => a.member_id));

  const canEdit    = canWriteMinutes(session, meeting.meeting_type);
  const isPublished = meeting.status === 'published';

  // 기존 content 파싱 — audio JSON이면 복원
  let savedContent = minutesData?.content || '';
  let savedAudioUrl = null;
  try {
    const parsed = JSON.parse(savedContent);
    if (parsed._audio) { savedAudioUrl = parsed.url; savedContent = parsed.notes || ''; activeContentTab = 'text'; }
  } catch { /* plain text */ }

  bodyEl.innerHTML = `
    <div class="page-header">
      <div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
          <span class="mi-type-badge ${meeting.meeting_type}">${TYPE_LABEL[meeting.meeting_type]||meeting.meeting_type}</span>
          <span class="mi-status ${meeting.status}">${isPublished?'✓ 게시됨':'초안'}</span>
        </div>
        <h1>${meeting.title || '회의록'}</h1>
        <p>${meeting.meeting_date}</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <a href="/portal/meetings.html" class="btn btn-outline btn-sm">← 목록</a>
        ${canEdit ? `<button class="btn btn-outline btn-sm" id="deleteBtn" style="color:#CC0000;border-color:#CC0000">삭제</button>` : ''}
        ${canEdit && !isPublished ? `<button class="btn btn-secondary btn-sm" id="publishBtn">게시하기</button>` : ''}
        ${canEdit ? `<button class="btn btn-primary btn-sm" id="saveBtn">저장</button>` : ''}
      </div>
    </div>

    <!-- 참석자 -->
    <div class="card" style="margin-bottom:16px">
      <div class="attendee-header">
        <span class="card-title" style="margin:0">
          참석자 <span id="attendCount" style="font-size:12px;font-weight:400;color:#9ca3af;margin-left:6px"></span>
        </span>
        ${canEdit ? `
        <div class="att-actions">
          <button class="btn btn-outline btn-sm" id="selectAllBtn">전체선택</button>
          <button class="btn btn-outline btn-sm" id="clearAllBtn">전체해제</button>
        </div>` : ''}
      </div>
      <div id="attendeeGrid" class="attendee-grid"></div>
    </div>

    <!-- 회의록 내용 -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-title" style="margin-bottom:12px">회의록 내용</div>

      ${canEdit ? `
      <div class="content-tab-bar">
        <button class="ctab ${activeContentTab==='text'?'active':''}" data-ctab="text">✏️ 직접 입력</button>
        <button class="ctab ${activeContentTab==='record'?'active':''}" data-ctab="record">🎙️ 녹음</button>
        <button class="ctab ${activeContentTab==='upload'?'active':''}" data-ctab="upload">📁 파일 업로드</button>
      </div>` : ''}

      <!-- 텍스트 -->
      <div class="content-panel ${!canEdit || activeContentTab==='text' ? 'active' : ''}" id="cpanel-text">
        ${canEdit
          ? `<textarea id="minutesContent" class="form-input minutes-area" placeholder="회의 내용을 자유 형식으로 작성하세요...">${savedContent}</textarea>`
          : `<div style="white-space:pre-wrap;font-size:13px;line-height:1.8">${savedContent || '(내용 없음)'}</div>`}
        ${savedAudioUrl && !canEdit ? `<div style="margin-top:12px"><div style="font-size:12px;color:#9ca3af;margin-bottom:4px">첨부 녹음</div><audio src="${savedAudioUrl}" controls></audio></div>` : ''}
      </div>

      <!-- 녹음 (편집 모드만) -->
      ${canEdit ? `
      <div class="content-panel ${activeContentTab==='record'?'active':''}" id="cpanel-record">
        <div class="rec-area">
          <div class="rec-timer" id="recTimer">00:00</div>
          <button class="rec-btn" id="recBtn">🎙️</button>
          <div class="rec-status" id="recStatus">버튼을 눌러 녹음을 시작하세요</div>
        </div>
        <div id="recPreview" style="display:none">
          <audio id="recAudio" controls style="width:100%;border-radius:8px"></audio>
          <textarea id="recNotes" class="form-input rec-note" rows="3" placeholder="녹음 내용 메모 (선택)" style="margin-top:10px">${savedContent}</textarea>
        </div>
        ${savedAudioUrl ? `<div style="margin-top:8px"><div style="font-size:12px;color:#9ca3af;margin-bottom:4px">저장된 녹음</div><audio src="${savedAudioUrl}" controls style="width:100%"></audio></div>` : ''}
      </div>

      <!-- 업로드 (편집 모드만) -->
      <div class="content-panel ${activeContentTab==='upload'?'active':''}" id="cpanel-upload">
        <div class="upload-drop" id="uploadDrop">
          <div style="font-size:32px;margin-bottom:8px">🎧</div>
          <div style="font-size:14px;font-weight:600;margin-bottom:4px">오디오 파일을 드래그하거나 클릭해서 선택</div>
          <div style="font-size:12px">mp3, m4a, wav, ogg 지원</div>
          <input type="file" id="audioFile" accept="audio/*" style="display:none">
        </div>
        <div id="uploadPreview" class="upload-preview" style="display:none">
          <audio id="uploadAudio" controls style="width:100%;border-radius:8px"></audio>
          <textarea id="uploadNotes" class="form-input" rows="3" placeholder="녹음 내용 메모 (선택)" style="margin-top:10px">${savedContent}</textarea>
        </div>
        ${savedAudioUrl ? `<div style="margin-top:8px"><div style="font-size:12px;color:#9ca3af;margin-bottom:4px">저장된 파일</div><audio src="${savedAudioUrl}" controls style="width:100%"></audio></div>` : ''}
      </div>` : ''}
    </div>
  `;

  renderAttendees(canEdit);

  // ── 참석자 전체선택/해제 ──
  document.getElementById('selectAllBtn')?.addEventListener('click', () => {
    allMembers.forEach(m => attendedSet.add(m.id));
    document.querySelectorAll('.att-btn').forEach(b => b.classList.add('on'));
    updateAttendCount();
  });
  document.getElementById('clearAllBtn')?.addEventListener('click', () => {
    attendedSet.clear();
    document.querySelectorAll('.att-btn').forEach(b => b.classList.remove('on'));
    updateAttendCount();
  });

  // ── 콘텐츠 탭 전환 ──
  document.querySelectorAll('.ctab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.ctab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      activeContentTab = btn.dataset.ctab;
      document.getElementById(`cpanel-${activeContentTab}`)?.classList.add('active');
    });
  });

  // ── 녹음 ──
  if (canEdit) {
    document.getElementById('recBtn')?.addEventListener('click', toggleRecording);

    // 업로드 드래그&드롭
    const drop = document.getElementById('uploadDrop');
    const fileInput = document.getElementById('audioFile');
    drop?.addEventListener('click', () => fileInput.click());
    fileInput?.addEventListener('change', () => handleUploadFile(fileInput.files[0]));
    drop?.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
    drop?.addEventListener('dragleave', () => drop.classList.remove('drag'));
    drop?.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('drag'); handleUploadFile(e.dataTransfer.files[0]); });
  }

  // ── 버튼 ──
  if (canEdit) {
    document.getElementById('saveBtn').addEventListener('click', () => saveAll(meetingId));
    document.getElementById('publishBtn')?.addEventListener('click', () => publishMeeting(meetingId));
    document.getElementById('deleteBtn')?.addEventListener('click', () => deleteMeeting(meetingId));
  }
});

/* ── 참석자 ── */
function renderAttendees(canEdit) {
  const grid = document.getElementById('attendeeGrid');
  if (!grid) return;
  grid.innerHTML = allMembers.map(m => `
    <button class="att-btn ${attendedSet.has(m.id) ? 'on' : ''}" data-mid="${m.id}">${m.name}</button>`).join('');
  if (canEdit) {
    grid.querySelectorAll('.att-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const mid = Number(btn.dataset.mid);
        if (attendedSet.has(mid)) { attendedSet.delete(mid); btn.classList.remove('on'); }
        else                      { attendedSet.add(mid);    btn.classList.add('on');    }
        updateAttendCount();
      });
    });
  }
  updateAttendCount();
}

function updateAttendCount() {
  const el = document.getElementById('attendCount');
  if (el) el.textContent = `${attendedSet.size} / ${allMembers.length}명`;
}

async function saveAttendees(meetingId) {
  await getSb().from('meeting_attendees').delete().eq('meeting_id', meetingId);
  const rows = [...attendedSet].map(id => ({ meeting_id: meetingId, member_id: id, attended: true }));
  if (rows.length) await getSb().from('meeting_attendees').insert(rows);
}

/* ── 녹음 ── */
function fmtSec(s) {
  return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

async function toggleRecording() {
  const btn    = document.getElementById('recBtn');
  const status = document.getElementById('recStatus');
  const timer  = document.getElementById('recTimer');

  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    clearInterval(recTimer);
    btn.classList.remove('recording');
    btn.textContent = '🎙️';
    status.textContent = '녹음 완료 — 저장 버튼을 눌러 업로드하세요';
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recChunks = []; recSec = 0;
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => recChunks.push(e.data);
    mediaRecorder.onstop = () => {
      recBlob = new Blob(recChunks, { type: 'audio/webm' });
      const url = URL.createObjectURL(recBlob);
      const audio = document.getElementById('recAudio');
      audio.src = url;
      document.getElementById('recPreview').style.display = 'block';
      stream.getTracks().forEach(t => t.stop());
    };
    mediaRecorder.start();
    btn.classList.add('recording');
    btn.textContent = '⏹️';
    status.textContent = '녹음 중... 버튼을 누르면 중지됩니다';
    recTimer = setInterval(() => { recSec++; timer.textContent = fmtSec(recSec); }, 1000);
  } catch(e) {
    alert('마이크 접근 오류: ' + e.message);
  }
}

function handleUploadFile(file) {
  if (!file) return;
  if (!file.type.startsWith('audio/')) { alert('오디오 파일만 업로드할 수 있습니다'); return; }
  uploadFile = file;
  const url  = URL.createObjectURL(file);
  document.getElementById('uploadAudio').src = url;
  document.getElementById('uploadPreview').style.display = 'block';
  document.getElementById('uploadDrop').style.display = 'none';
}

async function uploadAudio(meetingId) {
  const file = recBlob
    ? new File([recBlob], `recording-${meetingId}.webm`, { type: 'audio/webm' })
    : uploadFile;
  if (!file) return null;

  const path = `meetings/${meetingId}/${file.name || `audio-${Date.now()}.webm`}`;
  const { error } = await getSb().storage.from('meeting-recordings').upload(path, file, { upsert: true });
  if (error) {
    console.error('오디오 업로드 실패:', error.message);
    showToast('오디오 업로드 실패: ' + error.message);
    return null;
  }
  const { data } = getSb().storage.from('meeting-recordings').getPublicUrl(path);
  return data.publicUrl;
}

/* ── 저장 ── */
async function saveMinutes(meetingId) {
  let content = '';
  let audioUrl = null;

  if (activeContentTab === 'text') {
    content = document.getElementById('minutesContent')?.value || '';
  } else if (activeContentTab === 'record') {
    if (recBlob) audioUrl = await uploadAudio(meetingId);
    const notes = document.getElementById('recNotes')?.value || '';
    content = audioUrl ? JSON.stringify({ _audio: true, url: audioUrl, notes }) : notes;
  } else if (activeContentTab === 'upload') {
    if (uploadFile) audioUrl = await uploadAudio(meetingId);
    const notes = document.getElementById('uploadNotes')?.value || '';
    content = audioUrl ? JSON.stringify({ _audio: true, url: audioUrl, notes }) : notes;
  }

  const payload = { meeting_id: meetingId, content };
  let error;
  if (minutesData?.id) {
    ({ error } = await getSb().from('meeting_minutes').update(payload).eq('id', minutesData.id));
  } else {
    const res = await getSb().from('meeting_minutes').insert(payload).select().single();
    error = res.error;
    if (!error) minutesData = res.data;
  }
  if (error) { alert('저장 실패: ' + error.message); throw error; }
}

async function saveAll(meetingId) {
  try {
    await Promise.all([saveMinutes(meetingId), saveAttendees(meetingId)]);
    showToast('저장되었습니다');
  } catch { /* already alerted */ }
}

async function publishMeeting(meetingId) {
  await saveAll(meetingId);
  const { error } = await getSb().from('meetings').update({ status: 'published' }).eq('id', meetingId);
  if (error) alert('게시 실패: ' + error.message);
  else { showToast('게시되었습니다'); setTimeout(() => location.reload(), 800); }
}

async function deleteMeeting(meetingId) {
  if (!confirm('이 회의록을 삭제하시겠습니까?\n참석자 정보와 내용이 모두 삭제됩니다.')) return;
  await getSb().from('meeting_minutes').delete().eq('meeting_id', meetingId);
  await getSb().from('meeting_attendees').delete().eq('meeting_id', meetingId);
  const { error } = await getSb().from('meetings').delete().eq('id', meetingId);
  if (error) alert('삭제 실패: ' + error.message);
  else location.href = '/portal/meetings.html';
}

function showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#1a1f2e;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => { t.style.opacity='1'; setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),300); },2000); });
}
</script>
</body>
</html>
