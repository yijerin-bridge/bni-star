<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인터뷰 일정 — BNI STAR Portal</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/portal/css/portal.css">
  <style>
    .iv-wrap { overflow-x:auto; border:1.5px solid var(--border); border-radius:12px; background:#fff; }
    .iv-table { border-collapse:collapse; font-size:13px; width:100%; min-width:980px; }
    .iv-table thead tr.grp th { text-align:center; font-size:12px; color:#374151; border-bottom:1px solid #f0f0f0; }
    .iv-table .rv { background:#f8fafc; }
    .iv-table thead th.rv { background:#eef2f7; }
    .iv-table .rv-start { border-left:2px solid #e5e7eb; }
    .iv-table th { background:#f9fafb; font-size:11.5px; font-weight:700; color:#6b7280; text-align:left; padding:10px 12px; border-bottom:1.5px solid var(--border); white-space:nowrap; }
    .iv-table td { padding:7px 12px; border-bottom:1px solid #f0f0f0; vertical-align:middle; }
    .iv-table td.name { font-weight:700; white-space:nowrap; }
    .iv-table input { width:100%; padding:6px 8px; border:1.5px solid #e5e7eb; border-radius:7px; font-size:13px; font-family:inherit; background:#fff; }
    .iv-table input:focus { outline:none; border-color:#CC0000; }
    .iv-table input.saved { border-color:#16a34a; }
    .iv-table input.err { border-color:#CC0000; background:#fff1f2; }
    .iv-table .mt { border-left:2px solid #e5e7eb; text-align:center; }
    .iv-table select { width:72px; padding:6px 8px; border:1.5px solid #e5e7eb; border-radius:7px; font-size:14px; font-weight:800; font-family:inherit; background:#fff; text-align:center; cursor:pointer; }
    .iv-table select.ment-O { background:#ecfdf5; color:#166534; border-color:#86efac; }
    .iv-table select.ment-X { background:#fef2f2; color:#991b1b; border-color:#fca5a5; }
    .iv-table select.saved { border-color:#16a34a; }
    .iv-table select:disabled { opacity:.45; cursor:not-allowed; }
    .iv-dday { font-size:11px; color:#9ca3af; margin-left:6px; white-space:nowrap; }
    .iv-dday.soon { color:#CC0000; font-weight:700; }
    .iv-note { font-size:12px; color:#9ca3af; margin:10px 2px 0; }
    @media (max-width: 640px) {
      .iv-table, .iv-table tbody { display:block; width:100%; min-width:0; }
      .iv-table input { min-width:0; }
      .iv-table thead { display:none; }
      .iv-table tr { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:12px 14px; border-bottom:1px solid #f0f0f0; }
      .iv-table td { padding:0; border:0; min-width:0; }
      .iv-table td.name, .iv-table td.date { grid-column:1 / -1; }
      .iv-table td.rv { background:transparent; }
      .iv-table td.mt { grid-column:1 / -1; text-align:left; border-left:0; border-top:1px dashed #e5e7eb; padding-top:8px; }
      .iv-table td.rv-start { border-left:0; border-top:1px dashed #e5e7eb; padding-top:8px; }
      .iv-table td[data-label]::before { content:attr(data-label); display:block; font-size:11px; color:#9ca3af; margin-bottom:3px; }
    }
    .iv-count { background:#fff; border:1.5px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:14px; }
    .iv-count-head { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; font-size:13px; margin-bottom:8px; }
    .iv-count-head span { font-size:11.5px; color:#9ca3af; }
    .iv-chips { display:flex; flex-wrap:wrap; gap:6px; }
    .iv-chip { display:inline-flex; align-items:center; gap:4px; font-size:12px; padding:4px 9px; border-radius:999px; background:#f3f4f6; color:#374151; cursor:default; }
    .iv-chip b { font-weight:800; }
    .iv-chip small { font-size:10px; color:#6b7280; }
    .iv-chip.zero { background:#ecfdf5; color:#166534; }
    .iv-chip.top { background:#fee2e2; color:#991b1b; }
    .iv-sort { display:flex; align-items:center; gap:6px; font-size:12px; color:#6b7280; margin-bottom:10px; }
    .iv-sort button { border:1.5px solid #e5e7eb; background:#fff; border-radius:999px; padding:4px 12px; font-size:12px; font-family:inherit; cursor:pointer; color:#374151; }
    .iv-sort button.on { background:#1a1f2e; border-color:#1a1f2e; color:#fff; font-weight:700; }
    .iv-notice { background:#fff7ed; border:1.5px solid #fdba74; color:#9a3412; border-radius:12px; padding:14px 16px; font-size:13.5px; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/members-data.js"></script>
<script src="/portal/js/portal-auth.js"></script>
<script src="/portal/js/portal-nav.js"></script>
<script src="/portal/js/interviews.js"></script>
</body>
</html>
