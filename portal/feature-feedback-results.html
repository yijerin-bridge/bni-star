<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>피처 피드백 결과 — BNI 스타챕터</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Noto Sans KR',sans-serif; background:#f3f4f6; color:#1a1a1a; min-height:100vh; }

    .topbar { background:#8B0000; color:#fff; padding:14px 20px; display:flex; align-items:center; gap:10px; }
    .topbar-logo { font-size:17px; font-weight:900; letter-spacing:-.5px; }
    .topbar-sub  { font-size:12px; opacity:.7; }
    .topbar-badge{ margin-left:auto; font-size:11px; background:rgba(255,255,255,.2); padding:3px 10px; border-radius:20px; }

    .container { max-width:900px; margin:0 auto; padding:28px 16px 60px; }
    .page-title { font-size:20px; font-weight:900; margin-bottom:4px; }
    .page-sub   { font-size:13px; color:#6b7280; margin-bottom:24px; }

    .controls { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; align-items:center; }
    .controls select { padding:8px 12px; border:1.5px solid #e5e7eb; border-radius:8px; font-size:13px; font-family:inherit; background:#fff; }

    .pill-count { background:#8B0000; color:#fff; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; }

    .section-title { font-size:14px; font-weight:800; margin:20px 0 10px; }

    .summary-table { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .summary-table th { background:#8B0000; color:#fff; font-size:12px; font-weight:700; padding:10px 14px; text-align:left; }
    .summary-table th:not(:first-child) { text-align:center; }
    .summary-table td { padding:10px 14px; font-size:13px; border-bottom:1px solid #f3f4f6; }
    .summary-table td:not(:first-child) { text-align:center; font-weight:700; }
    .summary-table tr:last-child td { border-bottom:none; }
    .score-chip { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700; }
    .score-high { background:#dcfce7; color:#15803d; }
    .score-mid  { background:#fef9c3; color:#854d0e; }
    .score-low  { background:#fee2e2; color:#b91c1c; }

    .presenter-card { background:#fff; border-radius:14px; padding:20px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .pc-header { display:flex; align-items:center; margin-bottom:14px; }
    .pc-name { font-size:17px; font-weight:900; }
    .pc-meta { font-size:12px; color:#9ca3af; margin-top:2px; }
    .pc-avg  { margin-left:auto; font-size:22px; font-weight:900; color:#8B0000; }
    .pc-avg-sub { font-size:11px; color:#9ca3af; text-align:right; }

    .q-row { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
    .q-row-text { font-size:12px; color:#374151; flex:1; }
    .q-bar-wrap { width:120px; height:7px; background:#f3f4f6; border-radius:4px; flex-shrink:0; }
    .q-bar { height:7px; border-radius:4px; background:#8B0000; }
    .q-score { font-size:12px; font-weight:700; width:28px; text-align:right; flex-shrink:0; }

    .comment-list { margin-top:12px; border-top:1px solid #f3f4f6; padding-top:12px; }
    .comment-item { background:#f9fafb; border-radius:8px; padding:10px 12px; margin-bottom:6px; font-size:12px; color:#374151; line-height:1.6; }
    .comment-date { font-size:10px; color:#9ca3af; margin-bottom:3px; }
    .toggle-btn { font-size:12px; color:#8B0000; background:none; border:none; cursor:pointer; font-family:inherit; font-weight:600; padding:0; margin-top:8px; }

    .gate { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; text-align:center; gap:12px; }
    .gate-icon { font-size:48px; }
    .gate-title { font-size:18px; font-weight:800; }
    .gate-sub   { font-size:13px; color:#6b7280; }
  </style>
</head>
<body>
<div class="topbar">
  <span class="topbar-logo">BNI 스타챕터</span>
  <span class="topbar-sub">피처 피드백 결과</span>
  <span class="topbar-badge">결과 공유링크</span>
</div>

<div class="container" id="root">
  <div class="gate"><div class="gate-icon">🔒</div><div class="gate-title">접근 권한 확인 중...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script>
const params = new URLSearchParams(location.search);
const presenterParam = params.get('presenter') || '';

init();

const QUESTIONS = [
  { key:'q1', text:'무엇을 하는 사람인지 명확하게 이해됐다', short:'명확한 이해' },
  { key:'q2', text:'어떤 고객을 찾고 있는지 구체적으로 그려졌다', short:'고객 묘사' },
  { key:'q3', text:'경쟁자와 다른 강점이 기억에 남는다', short:'차별 강점' },
  { key:'q4', text:'"이런 분 소개해 주세요"라는 요청이 분명했다', short:'소개 요청' },
  { key:'q5', text:'소개하고 싶은 사람이 실제로 떠올랐다', short:'이름 떠오름' },
  { key:'q6', text:'믿고 소개해도 되겠다는 신뢰가 느껴졌다', short:'신뢰' },
];

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
let allFeedback = [];

function avg(arr, key) {
  const vals = arr.map(r=>r[key]).filter(v=>v!=null);
  return vals.length ? vals.reduce((s,v)=>s+v,0)/vals.length : null;
}
function fmt(v) { return v!=null ? v.toFixed(1) : '—'; }
function scoreClass(v) { return v>=4.2?'score-high':v>=3.0?'score-mid':'score-low'; }

function groupByPresenter(data) {
  const map = {};
  data.forEach(r => { if(!map[r.presenter_name]) map[r.presenter_name]=[]; map[r.presenter_name].push(r); });
  return Object.entries(map).sort((a,b) => {
    const sa=QUESTIONS.reduce((s,q)=>s+(avg(a[1],q.key)||0),0);
    const sb2=QUESTIONS.reduce((s,q)=>s+(avg(b[1],q.key)||0),0);
    return sb2-sa;
  });
}

function renderSummary(grouped) {
  const tbl = document.getElementById('summaryTbl');
  if (!grouped.length) { tbl.innerHTML=''; return; }
  tbl.innerHTML = `
    <thead><tr><th>발표자</th><th>응답</th>${QUESTIONS.map(q=>`<th>${q.short}</th>`).join('')}<th>평균</th></tr></thead>
    <tbody>${grouped.map(([name,recs]) => {
      const avgs=QUESTIONS.map(q=>avg(recs,q.key));
      const tot=avgs.filter(v=>v!=null);
      const ov=tot.length?tot.reduce((s,v)=>s+v,0)/tot.length:null;
      return `<tr><td style="font-weight:700">${name}</td><td>${recs.length}</td>
        ${avgs.map(v=>`<td><span class="score-chip ${scoreClass(v??0)}">${fmt(v)}</span></td>`).join('')}
        <td><span class="score-chip ${scoreClass(ov??0)}" style="font-size:13px">${fmt(ov)}</span></td></tr>`;
    }).join('')}</tbody>`;
}

function renderCards(grouped) {
  document.getElementById('detailCards').innerHTML = grouped.map(([name,recs]) => {
    const avgs=QUESTIONS.map(q=>avg(recs,q.key));
    const tot=avgs.filter(v=>v!=null);
    const ov=tot.length?tot.reduce((s,v)=>s+v,0)/tot.length:null;
    const comments=recs.filter(r=>r.comment);
    const eid=encodeURIComponent(name);
    return `<div class="presenter-card">
      <div class="pc-header">
        <div><div class="pc-name">${name}</div><div class="pc-meta">응답 ${recs.length}건</div></div>
        <div style="text-align:right"><div class="pc-avg">${fmt(ov)}</div><div class="pc-avg-sub">종합 / 5.0</div></div>
      </div>
      ${QUESTIONS.map((q,i)=>{
        const v=avgs[i], w=v!=null?Math.round(v/5*100):0;
        return `<div class="q-row">
          <div class="q-row-text">${q.text}</div>
          <div class="q-bar-wrap"><div class="q-bar" style="width:${w}%"></div></div>
          <div class="q-score">${fmt(v)}</div></div>`;
      }).join('')}
      ${comments.length?`<div class="comment-list">
        <button class="toggle-btn" onclick="toggleComments(this,'${eid}')">💬 코멘트 ${comments.length}건 보기</button>
        <div id="cmt-${eid}" style="display:none;margin-top:8px">
          ${comments.map(r=>`<div class="comment-item"><div class="comment-date">${r.created_at.slice(0,10)}</div>${r.comment}</div>`).join('')}
        </div></div>`:''}
    </div>`;
  }).join('');
}

window.toggleComments = (btn, id) => {
  const el=document.getElementById('cmt-'+id);
  const hidden=el.style.display==='none';
  el.style.display=hidden?'block':'none';
  btn.textContent=hidden?'💬 코멘트 접기':`💬 코멘트 ${el.querySelectorAll('.comment-item').length}건 보기`;
};

function applyFilters() {
  let filtered = allFeedback;
  const pv = presenterParam || document.getElementById('pfFilter')?.value || '';
  const period = document.getElementById('periodFilter')?.value;
  if (pv) filtered = filtered.filter(r=>r.presenter_name===pv);
  if (period) {
    const cutoff = new Date(Date.now()-parseInt(period)*86400000).toISOString();
    filtered = filtered.filter(r=>r.created_at>=cutoff);
  }
  const tc = document.getElementById('totalCount');
  if (tc) tc.textContent = filtered.length;
  const grouped = groupByPresenter(filtered);
  renderSummary(grouped);
  renderCards(grouped);
}

async function init() {
  const root = document.getElementById('root');

  const { data } = await sb.from('feature_feedback').select('*').order('created_at', { ascending:false });
  allFeedback = data || [];

  if (presenterParam) {
    // 발표자 단독 결과 화면
    root.innerHTML = `
      <div class="page-title">${presenterParam} 피드백 결과</div>
      <p class="page-sub">BNI 스타챕터 피처 프레젠테이션</p>
      <span class="pill-count" id="totalCount">—</span>
      <span style="font-size:12px;color:#9ca3af;margin-left:6px">건</span>
      <div style="margin-top:20px" id="detailCards"></div>
    `;
    document.getElementById('summaryTbl') || root.insertAdjacentHTML('beforeend', '<table id="summaryTbl" style="display:none"></table>');
  } else {
    // 전체 결과 화면
    root.innerHTML = `
      <div class="page-title">피처 피드백 결과</div>
      <p class="page-sub">BNI 스타챕터 피처 프레젠테이션</p>
      <div class="controls">
        <select id="pfFilter"><option value="">전체 발표자</option></select>
        <select id="periodFilter">
          <option value="">전체 기간</option>
          <option value="7">최근 7일</option>
          <option value="30">최근 30일</option>
          <option value="90">최근 90일</option>
        </select>
        <span class="pill-count" id="totalCount">—</span>
        <span style="font-size:12px;color:#9ca3af">건</span>
      </div>
      <div class="section-title">📋 발표자별 요약</div>
      <div style="overflow-x:auto;margin-bottom:20px"><table class="summary-table" id="summaryTbl"></table></div>
      <div class="section-title">📌 발표자별 상세</div>
      <div id="detailCards"></div>
    `;
    const names=[...new Set(allFeedback.map(r=>r.presenter_name))].sort();
    const sel=document.getElementById('pfFilter');
    names.forEach(n=>{ const o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o); });
    document.getElementById('pfFilter').addEventListener('change', applyFilters);
    document.getElementById('periodFilter').addEventListener('change', applyFilters);
  }

  applyFilters();
}
</script>
</body>
</html>
