<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PALMS 분석 — BNI STAR</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Noto Sans KR',sans-serif;font-size:14px;background:#f0f2f5;color:#111827;padding:20px 16px}
    .wrap{max-width:900px;margin:0 auto}
    .hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
    .logo{font-size:16px;font-weight:900;color:#CC0000}
    .hdr-title{font-size:20px;font-weight:900}
    .hdr-sub{font-size:12px;color:#9ca3af;margin-top:2px}
    .ro-tag{font-size:11px;color:#9ca3af;background:#f3f4f6;padding:3px 10px;border-radius:20px}
    .card{background:#fff;border-radius:12px;border:1px solid #e5e7eb;padding:18px;margin-bottom:14px}
    .card-title{font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:14px}
    .kpi-card{background:#fff;border-radius:10px;border:1px solid #e5e7eb;padding:12px}
    .kpi-label{font-size:11px;color:#6b7280;margin-bottom:4px}
    .kpi-num{font-size:20px;font-weight:900}
    .ai-tip{padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.6;display:flex;gap:10px;margin-bottom:6px}
    .ai-tip.positive{background:#f0fdf4}.ai-tip.warning{background:#fefce8}
    .ai-tip.action{background:#eff6ff}.ai-tip.critical{background:#fff1f2}
    .leader-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:14px}
    .leader-card{border-radius:12px;padding:16px}
    .rank-list{display:flex;flex-direction:column;gap:6px}
    .rank-item{display:flex;align-items:center;gap:10px;font-size:13px}
    .rank-num{font-size:12px;font-weight:700;width:20px;text-align:center;color:#9ca3af}
    .rank-num.top1{color:#f59e0b}.rank-num.top2{color:#6b7280}.rank-num.top3{color:#92400e}
    .rank-name{flex:1}.rank-val{font-weight:700}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th{background:#1a1f2e;color:#fff;padding:8px 10px;white-space:nowrap;text-align:center}
    td{padding:7px 10px;border-bottom:1px solid #f3f4f6;text-align:center}
    td:first-child{text-align:left;font-weight:600}
    tr.absent td{background:#fff5f5}
    .overflow{overflow-x:auto}
    .footer{text-align:center;font-size:11px;color:#d1d5db;margin-top:24px}
    .section-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
    @media(max-width:600px){.section-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="hdr">
    <div>
      <div class="logo">BNI ★ STAR</div>
      <div class="hdr-title">PALMS 분석</div>
      <div class="hdr-sub" id="hdrSub">불러오는 중...</div>
    </div>
    <span class="ro-tag">🔒 읽기 전용</span>
  </div>
  <div id="root"><div style="text-align:center;padding:60px;color:#9ca3af">데이터 불러오는 중...</div></div>
  <div class="footer">BNI STAR Portal · PALMS 분석 공유 페이지</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script>
function fmtComma(v){return Number(v||0).toLocaleString('ko-KR');}

(async()=>{
  const params=new URLSearchParams(location.search);
  const start=params.get('start'), end=params.get('end');
  if(!start||!end){
    document.getElementById('root').innerHTML='<div style="text-align:center;padding:60px;color:#9ca3af">URL에 start/end 파라미터가 필요합니다.</div>';
    return;
  }
  document.getElementById('hdrSub').textContent=`${start} ~ ${end}`;

  const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
  const {data,error}=await sb.from('palms_records').select('*').eq('period_start',start).eq('period_end',end);
  if(error||!data?.length){
    document.getElementById('root').innerHTML=`<div style="text-align:center;padding:60px;color:#9ca3af">해당 기간(${start}~${end}) 데이터가 없습니다.</div>`;
    return;
  }

  // 집계 — PALMS 공식
  const n=data.length;
  const totP=data.reduce((s,m)=>s+(m.attendance||0),0);
  const totA=data.reduce((s,m)=>s+(m.absence||0),0);
  const totL=data.reduce((s,m)=>s+(m.late_leave||0),0);
  const totM=data.reduce((s,m)=>s+(m.sick_leave||0),0);
  const totS=data.reduce((s,m)=>s+(m.substitute||0),0);
  const totPLMS=totP+totL+totM+totS;
  const totAll=totPLMS+totA;
  const attendRate=totAll>0?Math.round(totPLMS/totAll*100):0;
  const totRef=data.reduce((s,m)=>s+(m.given_t1||0)+(m.given_t2||0),0);
  const totVis=data.reduce((s,m)=>s+(m.visitors||0),0);
  const totOno=data.reduce((s,m)=>s+(m.one_on_one||0),0);
  const totTyf=data.reduce((s,m)=>s+Number(m.tyfcb||0),0);
  const totCeu=data.reduce((s,m)=>s+(m.ceu||0),0);

  const topRef=[...data].filter(m=>(m.given_t1||0)+(m.given_t2||0)>0).sort((a,b)=>((b.given_t1||0)+(b.given_t2||0))-((a.given_t1||0)+(a.given_t2||0)));
  const topOno=[...data].filter(m=>(m.one_on_one||0)>0).sort((a,b)=>(b.one_on_one||0)-(a.one_on_one||0));
  const topVis=[...data].filter(m=>(m.visitors||0)>0).sort((a,b)=>(b.visitors||0)-(a.visitors||0));
  const topTyf=[...data].filter(m=>(m.tyfcb||0)>0).sort((a,b)=>Number(b.tyfcb||0)-Number(a.tyfcb||0));
  const zeroRef=data.filter(m=>(m.given_t1||0)+(m.given_t2||0)===0);
  const absentees=data.filter(m=>(m.absence||0)>0);

  const leaders=[
    {cat:'리퍼럴 리더',icon:'🤝',top:topRef,val:m=>((m.given_t1||0)+(m.given_t2||0))+'건',color:'#2563eb'},
    {cat:'원투원 리더',icon:'☕',top:topOno,val:m=>(m.one_on_one||0)+'회',color:'#0891b2'},
    {cat:'비지터 리더',icon:'🙋',top:topVis,val:m=>(m.visitors||0)+'명',color:'#7c3aed'},
    {cat:'감사장 리더',icon:'💰',top:topTyf,val:m=>fmtComma(m.tyfcb)+'원',color:'#16a34a'},
  ];

  const tips=[];
  if(attendRate>=90) tips.push({type:'positive',icon:'✅',text:`출석률 ${attendRate}% (P+L+M+S 기준) — 챕터 참여도가 높습니다.`});
  else if(attendRate>=75) tips.push({type:'warning',icon:'⚠️',text:`출석률 ${attendRate}% — 일부 개선이 필요합니다.`});
  else tips.push({type:'critical',icon:'🚨',text:`출석률 ${attendRate}% — 출석 관리가 시급합니다.`});
  if(totRef>0) tips.push({type:'positive',icon:'🤝',text:`총 리퍼럴 ${totRef}건 — 인당 평균 ${(totRef/n).toFixed(1)}건입니다.`});
  if(zeroRef.length>0) tips.push({type:'action',icon:'👉',text:`리퍼럴 0건 멤버 ${zeroRef.length}명 (${zeroRef.slice(0,3).map(m=>m.member_name).join(', ')}${zeroRef.length>3?' 외':''}): 독려 필요.`});
  if(absentees.length>0) tips.push({type:'warning',icon:'⚠️',text:`결석 발생 멤버 ${absentees.length}명 (${absentees.map(m=>m.member_name).join(', ')}): 확인 필요.`});
  if(totTyf>0) tips.push({type:'positive',icon:'💰',text:`감사장 총액 ${fmtComma(totTyf)}원 — 인당 평균 ${fmtComma(Math.round(totTyf/n))}원.`});

  document.getElementById('root').innerHTML=`
    <!-- KPI -->
    <div class="kpi-grid">
      ${[
        ['출석률 (PLMS)',attendRate+'%',attendRate>=90?'#16a34a':attendRate>=75?'#ca8a04':'#CC0000'],
        ['결석',totA+'건','#CC0000'],
        ['리퍼럴',totRef+'건','#2563eb'],
        ['원투원',totOno+'회','#0891b2'],
        ['비지터',totVis+'명','#7c3aed'],
        ['감사장',fmtComma(totTyf)+'원','#16a34a'],
        ['CEU',totCeu+'점','#6b7280'],
      ].map(([l,v,c])=>`<div class="kpi-card"><div class="kpi-label">${l}</div><div class="kpi-num" style="color:${c}">${v}</div></div>`).join('')}
    </div>

    <!-- AI 피드백 -->
    <div class="card">
      <div class="card-title">🤖 AI 챕터 피드백</div>
      ${tips.map(t=>`<div class="ai-tip ${t.type}"><span>${t.icon}</span><span>${t.text}</span></div>`).join('')}
    </div>

    <!-- 부문 리더 -->
    <div class="card">
      <div class="card-title">🏆 부문별 리더</div>
      <div class="leader-grid">
        ${leaders.map(l=>{
          const w=l.top[0];
          return w?`<div class="leader-card" style="border:2px solid ${l.color}30;background:${l.color}08">
            <div style="font-size:11px;font-weight:700;color:${l.color};margin-bottom:8px">${l.icon} ${l.cat}</div>
            <div style="font-size:16px;font-weight:900">${w.member_name}</div>
            <div style="font-size:13px;color:${l.color};font-weight:700">${l.val(w)}</div>
            ${l.top.slice(1,3).map((m,i)=>`<div style="font-size:11px;color:#6b7280;margin-top:4px">${i===0?'🥈':'🥉'} ${m.member_name} ${l.val(m)}</div>`).join('')}
          </div>`:`<div class="leader-card" style="border:2px dashed #e5e7eb;text-align:center;color:#9ca3af"><div>${l.icon} ${l.cat}</div><div style="font-size:12px">데이터 없음</div></div>`;
        }).join('')}
      </div>
    </div>

    <!-- 전체 테이블 -->
    <div class="card">
      <div class="card-title">전체 멤버 상세</div>
      <div class="overflow">
        <table>
          <thead><tr><th>이름</th><th>출석</th><th>결석</th><th>지각</th><th>병가</th><th>대리인</th><th>준T1</th><th>준T2</th><th>비지터</th><th>1:1</th><th>감사장</th><th>CEU</th></tr></thead>
          <tbody>
            ${[...data].sort((a,b)=>a.member_name.localeCompare(b.member_name,'ko')).map(m=>`
            <tr class="${(m.absence||0)>0?'absent':''}">
              <td>${m.member_name}</td>
              <td>${m.attendance||0}</td><td>${m.absence||0}</td><td>${m.late_leave||0}</td>
              <td>${m.sick_leave||0}</td><td>${m.substitute||0}</td>
              <td>${m.given_t1||0}</td><td>${m.given_t2||0}</td>
              <td>${m.visitors||0}</td><td>${m.one_on_one||0}</td>
              <td>${fmtComma(m.tyfcb)}</td><td>${m.ceu||0}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
})();
</script>
</body>
</html>
