<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 성과 — BNI STAR Portal</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/portal/css/portal.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/members-data.js"></script>
<script src="/portal/js/portal-auth.js"></script>
<script src="/portal/js/portal-nav.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const layout = renderPortalLayout({ title: '내 성과' });
  if (!layout) return;
  const { session, bodyEl } = layout;

  const myName = session.memberName;
  if (!myName) {
    bodyEl.innerHTML = `<div class="alert-banner crit">로그인 정보에 이름이 없습니다. 다시 로그인해 주세요.</div>`;
    return;
  }

  bodyEl.innerHTML = `<div style="text-align:center;padding:48px;color:#9ca3af">데이터 불러오는 중...</div>`;

  const [wRes, membersData] = await Promise.all([
    getSb().from('weekly_records').select('*').eq('member_name', myName).order('week_date', { ascending: false }).limit(52),
    loadPortalMembers(),
  ]);
  const weekly = wRes.data || [];
  const me = membersData.find(m => m.name === myName);

  const weeks12 = getRecentWeeks(12);
  const weeks4  = weeks12.slice(0, 4);

  const stats4 = calcStats(myName, weekly, weeks4);

  const lc    = { green:'#16a34a', amber:'#ca8a04', red:'#CC0000', new:'#9ca3af' }[stats4.light] || '#9ca3af';
  const lbl   = { green:'Green 🟢', amber:'Amber 🟡', red:'Red 🔴', new:'활동 저조 ⚫' }[stats4.light] || '—';

  bodyEl.innerHTML = `
    <div class="page-header">
      <div>
        <h1>${myName} 님의 성과</h1>
        <p>${me?.company || ''} · 최근 4주 기준</p>
      </div>
    </div>

    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">
      <div class="kpi-card" style="border-top:3px solid ${lc}">
        <div class="kpi-label">트래픽라이트</div>
        <div class="kpi-num" style="color:${lc};font-size:18px">${lbl}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">출석 (기록 ${stats4.recorded}주)</div>
        <div class="kpi-num">${stats4.attendance}/${stats4.recorded}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">1:1 미팅 (4주)</div>
        <div class="kpi-num">${stats4.ono}회</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">리퍼럴 준 것 (4주)</div>
        <div class="kpi-num">${stats4.givenRef}건</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">리퍼럴 받은 것 (4주)</div>
        <div class="kpi-num">${stats4.recvRef}건</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">비지터 초대 (4주)</div>
        <div class="kpi-num">${stats4.visitors}명</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">감사장 금액 (4주)</div>
        <div class="kpi-num" style="font-size:16px">${fmtAmt(stats4.tyfcb)}</div>
      </div>
    </div>

    <div class="section-row">
      <div class="card" style="flex:2">
        <div class="card-title">주별 활동 내역 (최근 12주)</div>
        <div style="overflow-x:auto">
        <table class="data-table">
          <thead>
            <tr>
              <th>주차</th>
              <th>출석</th>
              <th>리퍼럴</th>
              <th>1:1</th>
              <th>비지터</th>
              <th>감사장</th>
              <th>교육</th>
            </tr>
          </thead>
          <tbody id="weeklyTable"></tbody>
        </table>
        </div>
      </div>
      <div class="card" style="flex:1">
        <div class="card-title">월별 감사장 금액</div>
        <canvas id="chartTyfcb" height="200"></canvas>
        <div class="card-title" style="margin-top:20px">월별 리퍼럴 건수</div>
        <canvas id="chartRef" height="180"></canvas>
      </div>
    </div>
  `;

  // 주별 테이블
  const tbody = document.getElementById('weeklyTable');
  const attendLabel = r => {
    if (!r) return '<span style="color:#d1d5db">—</span>';
    if (r.absent) return '<span style="color:#CC0000">결석</span>';
    if (r.late)   return '<span style="color:#ca8a04">지각</span>';
    if (r.sick)   return '<span style="color:#6366f1">병가</span>';
    if (r.substitute) return '<span style="color:#0891b2">대리인</span>';
    if (r.attended)   return '<span style="color:#16a34a">✓ 출석</span>';
    return '<span style="color:#d1d5db">—</span>';
  };

  weeks12.forEach(w => {
    const rec = weekly.find(r => r.week_date === w);
    const ref = rec ? (rec.given_t1||0) + (rec.given_t2||0) : null;
    const recv = rec ? (rec.received_t1||0) + (rec.received_t2||0) : null;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="white-space:nowrap;font-size:12px">${w}</td>
      <td>${attendLabel(rec)}</td>
      <td>${rec ? `<span style="font-weight:600">${ref}</span><span style="color:#9ca3af;font-size:11px"> +${recv}수신</span>` : '—'}</td>
      <td>${rec ? (rec.one_on_one||0) + '회' : '—'}</td>
      <td>${rec ? (rec.visitors||0) + '명' : '—'}</td>
      <td>${rec && rec.tyfcb ? fmtAmt(Number(rec.tyfcb)) : '—'}</td>
      <td>${rec ? (rec.ceu ? '✓' : '—') : '—'}</td>
    `;
    tbody.appendChild(tr);
  });

  // 월별 감사장 차트
  const tyfcbMap = {}, refMap = {};
  weekly.forEach(r => {
    const m = r.week_date?.slice(0,7); if (!m) return;
    tyfcbMap[m] = (tyfcbMap[m]||0) + (Number(r.tyfcb)||0);
    refMap[m]   = (refMap[m]||0)   + (r.given_t1||0) + (r.given_t2||0);
  });
  const mLabels = [...new Set([...Object.keys(tyfcbMap), ...Object.keys(refMap)])].sort().slice(-6);

  const ctxT = document.getElementById('chartTyfcb');
  if (ctxT && mLabels.length) {
    new Chart(ctxT, {
      type: 'bar',
      data: { labels: mLabels.map(l=>l.slice(2)), datasets:[{ data: mLabels.map(l=>tyfcbMap[l]||0), backgroundColor:'#CC0000', borderRadius:4 }] },
      options: { responsive:true, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, ticks:{callback:v=>fmtAmt(v)}}} },
    });
  }

  const ctxR = document.getElementById('chartRef');
  if (ctxR && mLabels.length) {
    new Chart(ctxR, {
      type: 'bar',
      data: { labels: mLabels.map(l=>l.slice(2)), datasets:[{ data: mLabels.map(l=>refMap[l]||0), backgroundColor:'#1a1f2e', borderRadius:4 }] },
      options: { responsive:true, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, ticks:{stepSize:1}}} },
    });
  }
});

/* traffic-light.js와 동일한 7항목 채점 */
function _sAbs(n)   { return n>2?0:n===2?5:n===1?10:15; }
function _sLate(n)  { return n>=2?0:n===1?5:10; }
function _sRef(avg) { return avg<0.5?0:avg<0.75?5:avg<1.0?10:avg<1.2?15:20; }
function _sTyf(t)   { return t<25000000?0:t<50000000?5:t<100000000?10:15; }
function _sVis(avg) { return avg<0.1?0:avg<0.2?5:avg<0.4?10:avg<0.6?15:20; }
function _sOno(avg) { return avg<1?0:avg<2?5:10; }
function _sCeu(t)   { return t<5?0:t<15?5:10; }

function calcStats(name, weekly, weeks) {
  // KPI 수치: 최근 N주 기록만
  const recs = weekly.filter(w => weeks.includes(w.week_date));
  const recorded   = recs.length;
  const attendance = recs.filter(w => w.attended || w.sick || w.substitute).length;
  const ono        = recs.reduce((s,w) => s + (w.one_on_one||0), 0);
  const givenRef   = recs.reduce((s,w) => s + (w.given_t1||0) + (w.given_t2||0), 0);
  const recvRef    = recs.reduce((s,w) => s + (w.received_t1||0) + (w.received_t2||0), 0);
  const visitors   = recs.reduce((s,w) => s + (w.visitors||0), 0);
  const tyfcb      = recs.reduce((s,w) => s + (Number(w.tyfcb)||0), 0);

  // light: 직전 6개월 윈도우 기준 7항목 채점
  const win6    = _get6MonthWindow();
  const allRecs = weekly.filter(w => w.week_date >= win6.start && w.week_date <= win6.end);
  const ar = allRecs.length;
  if (!ar) return { attendance, ono, givenRef, recvRef, visitors, tyfcb, light: 'gray', recorded };

  const absN   = allRecs.filter(w => w.absent).length;
  const lateN  = allRecs.filter(w => w.late).length;
  const totRef = allRecs.reduce((s,w) => s + (w.given_t1||0) + (w.given_t2||0), 0);
  const totVis = allRecs.reduce((s,w) => s + (w.visitors||0), 0);
  const totOno = allRecs.reduce((s,w) => s + (w.one_on_one||0), 0);
  const totTyf = allRecs.reduce((s,w) => s + (Number(w.tyfcb)||0), 0);
  const totCeu = allRecs.reduce((s,w) => s + (w.ceu||0), 0);
  const total  = _sAbs(absN)+_sLate(lateN)+_sRef(totRef/ar)+_sTyf(totTyf)+_sVis(totVis/ar)+_sOno(totOno/ar)+_sCeu(totCeu);
  const light  = total>=70?'green':total>=50?'amber':total>=30?'red':'gray';

  return { attendance, ono, givenRef, recvRef, visitors, tyfcb, light, recorded };
}

function _get6MonthWindow() {
  const t = new Date();
  const end   = new Date(t.getFullYear(), t.getMonth(), 0);
  const start = new Date(t.getFullYear(), t.getMonth() - 6, 1);
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return { start: fmt(start), end: fmt(end) };
}

function toLocalDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getRecentWeeks(n) {
  const today = new Date(), dow = today.getDay();
  const diff = dow >= 3 ? dow - 3 : dow + 4;
  const wed = new Date(today); wed.setDate(today.getDate() - diff);
  return Array.from({length:n}, (_,i) => { const d=new Date(wed); d.setDate(wed.getDate()-i*7); return toLocalDate(d); });
}

function fmtAmt(v) {
  const n = Number(v) || 0;
  if (n >= 100000000) return (n/100000000).toFixed(1) + '억원';
  return n.toLocaleString('ko-KR') + '원';
}
</script>
</body>
</html>
