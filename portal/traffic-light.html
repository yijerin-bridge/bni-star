<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>트래픽라이트 — BNI STAR Portal</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/portal/css/portal.css">
  <style>
    /* ── 탭 바 ── */
    .tl-tab-bar { display:flex;border-bottom:2px solid var(--border);margin-bottom:20px; }
    .tl-tab { padding:10px 20px;font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;
      border-bottom:2px solid transparent;margin-bottom:-2px;background:none;
      border-top:none;border-left:none;border-right:none;transition:all .15s; }
    .tl-tab.active { color:var(--red);border-bottom-color:var(--red);font-weight:700; }
    .tl-panel { display:none; }
    .tl-panel.active { display:block; }

    /* ── 월 네비 ── */
    .period-nav { display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap; }
    .period-nav button { padding:6px 14px;border-radius:8px;border:1.5px solid var(--border);
      background:#fff;cursor:pointer;font-size:13px;transition:all .12s; }
    .period-nav button:hover { border-color:#d1d5db; }
    .period-nav button:disabled { opacity:.35;cursor:not-allowed; }
    .period-label { font-size:15px;font-weight:700;min-width:120px;text-align:center; }

    /* ── 멤버 그리드 ── */
    .member-score-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px; }
    .ms-card { background:#fff;border:1.5px solid var(--border);border-radius:12px;
      padding:16px;cursor:pointer;transition:box-shadow .15s,border-color .15s; }
    .ms-card:hover { box-shadow:0 4px 14px rgba(0,0,0,.08);border-color:#d1d5db; }
    .ms-card.green { border-left:4px solid #16a34a; }
    .ms-card.amber { border-left:4px solid #ca8a04; }
    .ms-card.red { border-left:4px solid #CC0000; }
    .ms-card.new { border-left:4px solid #9ca3af; }
    .ms-name { font-size:14px;font-weight:700;margin-bottom:6px; }
    .ms-score-row { display:flex;align-items:center;justify-content:space-between;margin-bottom:8px; }
    .ms-score { font-size:22px;font-weight:900;line-height:1; }
    .ms-light { font-size:18px; }
    .ms-sparkline { display:flex;gap:3px;align-items:flex-end;height:24px; }
    .ms-spark-bar { flex:1;border-radius:2px 2px 0 0;min-width:6px;transition:height .3s; }
    .ms-sub { font-size:10px;color:#9ca3af;margin-top:6px; }

    /* ── 점수 뱃지 ── */
    .score-badge { display:inline-flex;align-items:center;gap:5px;padding:3px 10px;
      border-radius:20px;font-size:12px;font-weight:700; }
    .score-badge.green  { background:#dcfce7;color:#166534; }
    .score-badge.amber { background:#fef9c3;color:#713f12; }
    .score-badge.red    { background:#fee2e2;color:#991b1b; }
    .score-badge.new    { background:#f3f4f6;color:#9ca3af; }
    .score-badge.gray   { background:#f3f4f6;color:#374151; }

    /* ── 개인 상세 ── */
    .detail-table { width:100%;border-collapse:collapse;font-size:13px; }
    .detail-table th { background:#f9fafb;padding:10px 12px;text-align:center;
      font-size:11px;font-weight:700;color:#6b7280;border-bottom:2px solid var(--border); }
    .detail-table td { padding:10px 12px;text-align:center;border-bottom:1px solid #f3f4f6;vertical-align:middle; }
    .detail-table tr:hover td { background:#fafafa; }
    .detail-table td.period-col { text-align:left;font-weight:600; }
    .projected-row td { color:#9ca3af;font-style:italic; }
    .edit-input { width:60px;padding:4px 6px;border:1.5px solid #d1d5db;border-radius:6px;
      text-align:center;font-size:12px;font-family:inherit; }
    .edit-input:focus { outline:none;border-color:#2563eb; }

    /* ── 파일 업로드 ── */
    .upload-zone { border:2px dashed var(--border);border-radius:14px;padding:48px;
      text-align:center;cursor:pointer;transition:all .15s; }
    .upload-zone:hover,.upload-zone.drag { border-color:#CC0000;background:#fff5f5; }
    .preview-table-wrap { overflow-x:auto;max-height:400px;overflow-y:auto; }
    .preview-table { width:100%;border-collapse:collapse;font-size:12px; }
    .preview-table th { background:#1a1f2e;color:#fff;padding:8px 10px;position:sticky;top:0;white-space:nowrap; }
    .preview-table td { padding:6px 10px;border-bottom:1px solid #f3f4f6;white-space:nowrap; }
    .preview-table tr.unmatched td { background:#fff5f5; }
    .match-ok  { color:#16a34a;font-weight:600; }
    .match-no  { color:#CC0000;font-weight:600; }

    /* ── 점수 설정 ── */
    .config-row { display:grid;grid-template-columns:1fr 120px 120px;gap:12px;align-items:center;
      padding:12px 0;border-bottom:1px solid #f3f4f6; }
    .config-label { font-size:13px;font-weight:500; }
    .config-sub { font-size:11px;color:#9ca3af;margin-top:2px; }
    .config-input { padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;
      font-size:13px;text-align:center;font-family:inherit; }

    /* ── AI 피드백 ── */
    .ai-tip { padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.6;display:flex;gap:10px; }
    .ai-tip.positive { background:#f0fdf4; }
    .ai-tip.warning  { background:#fefce8; }
    .ai-tip.action   { background:#eff6ff; }
    .ai-tip.critical  { background:#fff1f2; }
    .ai-tip.highlight { background:#fdf4ff;border:1.5px solid #d8b4fe;font-weight:600; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/members-data.js"></script>
<script src="/portal/js/portal-auth.js"></script>
<script src="/portal/js/portal-nav.js"></script>
<script src="/portal/js/traffic-light.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const layout = renderPortalLayout({ title: '트래픽라이트' });
  if (!layout) return;
  const { session, bodyEl } = layout;

  if (!canAccessTraffic(session)) {
    bodyEl.innerHTML = `<div class="alert-banner crit" style="margin-top:24px">
      접근 권한이 없습니다. 부의장 또는 멤버십위원회 트래픽라이트 담당만 이용할 수 있습니다.</div>`;
    return;
  }

  initTrafficLight(session, bodyEl);
});
</script>
</body>
</html>
