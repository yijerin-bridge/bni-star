<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>챕터 목표 관리 — BNI STAR Portal</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/portal/css/portal.css">
  <style>
    .month-nav { display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap; }
    .month-nav button { padding:6px 14px;border-radius:8px;border:1.5px solid var(--border);background:#fff;cursor:pointer;font-size:13px; }
    .month-nav button:hover { border-color:#d1d5db; }
    .month-label { font-size:18px;font-weight:900;min-width:100px;text-align:center; }

    .view-toggle { display:flex;gap:0;border:1.5px solid var(--border);border-radius:8px;overflow:hidden; }
    .view-toggle button { padding:5px 13px;border:none;background:#fff;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit; }
    .view-toggle button.active { background:#CC0000;color:#fff; }

    .goals-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:24px; }
    .goal-card { background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:18px;position:relative; }
    .goal-card.light-green { border-left:4px solid #16a34a; }
    .goal-card.light-amber { border-left:4px solid #ca8a04; }
    .goal-card.light-red   { border-left:4px solid #CC0000; }
    .goal-card.light-gray  { border-left:4px solid #9ca3af; }

    .gc-header { display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px; }
    .gc-name   { font-size:13px;font-weight:700;flex:1; }
    .gc-badge  { font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;flex-shrink:0;margin-left:8px; }
    .gc-badge.auto   { background:#eff6ff;color:#2563eb; }
    .gc-badge.custom { background:#f5f3ff;color:#7c3aed; }
    .gc-light  { font-size:22px;line-height:1; }

    .gc-nums { display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px; }
    .gc-num-box { background:#f9fafb;border-radius:8px;padding:8px 10px; }
    .gc-num-label { font-size:10px;color:#9ca3af;margin-bottom:2px; }
    .gc-num-val { font-size:18px;font-weight:900; }
    .gc-num-unit { font-size:11px;color:#9ca3af;margin-left:2px; }

    .gc-bar-wrap { height:6px;background:#f3f4f6;border-radius:3px;overflow:hidden;margin-bottom:8px; }
    .gc-bar { height:100%;border-radius:3px;transition:width .4s; }
    .gc-pct  { font-size:12px;color:#6b7280;text-align:right; }
    .gc-notes { font-size:11px;color:#9ca3af;margin-top:6px;font-style:italic; }

    .gc-actions { position:absolute;top:12px;right:12px;display:flex;gap:4px;opacity:0;transition:opacity .15s; }
    .goal-card:hover .gc-actions { opacity:1; }
    .gc-btn { padding:3px 8px;font-size:11px;border:1.5px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font-family:inherit; }
    .gc-btn.del { color:#CC0000;border-color:#fca5a5; }

    .add-custom-btn { border:2px dashed var(--border);border-radius:14px;padding:18px;text-align:center;cursor:pointer;color:#9ca3af;font-size:13px;transition:all .15s; }
    .add-custom-btn:hover { border-color:#CC0000;color:#CC0000; }

    .section-title { font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);margin-bottom:12px;display:flex;align-items:center;gap:8px; }
    .section-title::after { content:'';flex:1;height:1px;background:var(--border); }

    .summary-bar { display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:24px; }
    .sum-card { background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:14px;text-align:center; }
    .sum-num  { font-size:24px;font-weight:900; }
    .sum-label{ font-size:11px;color:#9ca3af;margin-top:4px; }

    /* 추세 테이블 */
    .trend-wrap { overflow-x:auto;margin-bottom:24px; }
    .trend-table { width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px; }
    .trend-table th { background:#f9fafb;padding:8px 14px;font-weight:700;text-align:center;border:1px solid var(--border);position:sticky;top:0; }
    .trend-table th.metric-col { text-align:left;min-width:140px;position:sticky;left:0;z-index:2;background:#f9fafb; }
    .trend-table td { padding:10px 14px;border:1px solid var(--border);text-align:center;vertical-align:middle; }
    .trend-table td.metric-col { text-align:left;background:#fff;position:sticky;left:0;z-index:1;font-weight:600; }
    .trend-table td.metric-col .mc-sub { font-size:10px;font-weight:400;color:#9ca3af;margin-top:1px; }
    .trend-cell { display:flex;flex-direction:column;align-items:center;gap:2px; }
    .tc-signal { font-size:15px; }
    .tc-actual { font-size:13px;font-weight:700; }
    .tc-target { font-size:10px;color:#9ca3af; }
    .tc-pct    { font-size:10px;color:#6b7280; }
    .trend-table tr:hover td { background:#fafafa; }
    .trend-table tr:hover td.metric-col { background:#f5f5f5; }

    /* 기본 지표 다중선택 */
    .builtin-check-list { display:flex;flex-direction:column;gap:10px;margin-bottom:20px;max-height:60vh;overflow-y:auto; }
    .bc-item { border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;transition:border-color .15s; }
    .bc-item.checked { border-color:#CC0000;background:#fff5f5; }
    .bc-header { display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none; }
    .bc-check { width:18px;height:18px;accent-color:#CC0000;cursor:pointer;flex-shrink:0; }
    .bc-icon  { font-size:18px; }
    .bc-name  { font-size:14px;font-weight:700;flex:1; }
    .bc-unit  { font-size:11px;color:#9ca3af;background:#f3f4f6;padding:2px 6px;border-radius:6px; }
    .bc-desc  { font-size:11px;color:#9ca3af;margin-top:4px;padding-left:28px; }
    .bc-target-row { margin-top:10px;padding-left:28px;display:none;align-items:center;gap:8px; }
    .bc-target-row input { flex:1;max-width:140px; }
    .bc-item.checked .bc-target-row { display:flex; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/members-data.js"></script>
<script src="/portal/js/portal-auth.js"></script>
<script src="/portal/js/portal-nav.js"></script>
<script src="/portal/js/scoring.js"></script>
<script>
/* ── 기본 내장 지표 정의 ── */
const BUILTIN_METRICS = [
  { key:'attendance_rate',  name:'출석률',          unit:'%',   icon:'✅', desc:'월간 출석 기록 기준 (P+L+M+S / 전체)', autoCompute: true },
  { key:'referral_count',   name:'리퍼럴',          unit:'건',  icon:'🤝', desc:'월간 준 T1+T2 합계',                   autoCompute: true },
  { key:'visitor_count',    name:'비지터 초대',      unit:'명',  icon:'🙋', desc:'월간 비지터 합계',                     autoCompute: true },
  { key:'ono_count',        name:'원투원 (인당)',     unit:'회',  icon:'☕', desc:'월간 1:1 미팅 인당 평균',              autoCompute: true },
  { key:'tyfcb_amount',     name:'감사장 금액',      unit:'만원',icon:'💰', desc:'월간 TYFCB 합계 (만원)',              autoCompute: true },
  { key:'ceu_count',        name:'CEU 총합',         unit:'점',  icon:'📚', desc:'월간 CEU 합계',                       autoCompute: true },
  { key:'sponsored_count',  name:'스폰서 (신규추천)',unit:'명',  icon:'⭐', desc:'월간 신규추천회원 합계',              autoCompute: true },
  { key:'green_member_pct', name:'Green 멤버 비율',  unit:'%',   icon:'🟢', desc:'트래픽라이트 Green 멤버 비율 (자동집계)', autoCompute: true },
];

let currentYM = '', weeklyAll = [], goalsAll = [], canEdit = false;
let viewMode = 'trend'; // 'cards' | 'trend'
let trendYear = new Date().getFullYear();

function getSb() { return supabase.createClient(SUPABASE_URL, SUPABASE_ANON); }
function fmtYM(ym) { const [y,m] = ym.split('-'); return `${y}년 ${Number(m)}월`; }
function fmtYMShort(ym) { const [y,m] = ym.split('-'); return `${y.slice(2)}.${Number(m)}`; }
function shiftMonth(ym, delta) { const d = new Date(ym + '-01'); d.setMonth(d.getMonth() + delta); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function thisYM() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }

/* ── 월간 실적 자동 계산 ── */
function computeActual(key, ym) {
  const recs = weeklyAll.filter(r => r.week_date && r.week_date.startsWith(ym));
  switch(key) {
    case 'attendance_rate': {
      if (!recs.length) return null;
      const present = recs.filter(r => !r.absent).length;
      return Math.round(present / recs.length * 100);
    }
    case 'referral_count':  return recs.length ? recs.reduce((s,r)=>s+(r.given_t1||0)+(r.given_t2||0),0) : null;
    case 'visitor_count':   return recs.length ? recs.reduce((s,r)=>s+(r.visitors||0),0) : null;
    case 'ono_count': {
      if (!recs.length) return null;
      const memberCount = new Set(recs.map(r => r.member_id)).size;
      const total = recs.reduce((s,r)=>s+(r.one_on_one||0),0);
      return memberCount ? Math.round(total / memberCount * 10) / 10 : null;
    }
    case 'tyfcb_amount':    return recs.length ? Math.round(recs.reduce((s,r)=>s+Number(r.tyfcb||0),0)/10000) : null;
    case 'ceu_count':       return recs.length ? recs.reduce((s,r)=>s+(r.ceu||0),0) : null;
    case 'sponsored_count': return recs.length ? recs.reduce((s,r)=>s+(r.sponsored||0),0) : null;
    case 'green_member_pct': return computeGreenPct(ym);
    default: return null;
  }
}

function computeGreenPct(ym) {
  const recs = weeklyAll.filter(r => r.week_date && r.week_date.startsWith(ym));
  if (!recs.length) return null;
  const weeks = [...new Set(recs.map(r => r.week_date))];
  const memberIds = [...new Set(recs.map(r => r.member_id))];
  if (!memberIds.length) return null;
  const greenCount = memberIds.filter(mid => {
    const mRecs = recs.filter(r => r.member_id === mid);
    const { light } = calcMemberScore(mRecs, weeks.length);
    return light === 'green';
  }).length;
  return Math.round(greenCount / memberIds.length * 100);
}

function getLightFromRate(rate) {
  if (rate === null || rate === undefined) return 'gray';
  if (rate >= 100) return 'green';
  if (rate >= 75)  return 'amber';
  return 'red';
}

function lightEmoji(l) { return {green:'🟢',amber:'🟡',red:'🔴',gray:'⚫'}[l]||'⚫'; }
function lightColor(l) { return {green:'#16a34a',amber:'#ca8a04',red:'#CC0000',gray:'#9ca3af'}[l]||'#9ca3af'; }

/* ── 카드 계산 헬퍼 ── */
function buildCards(ym) {
  const goals = goalsAll.filter(g => g.year_month === ym);
  return goals.map(g => {
    const bm = BUILTIN_METRICS.find(b => b.key === g.metric_key);
    const actual = (bm?.autoCompute && g.actual_value == null)
      ? computeActual(g.metric_key, ym)
      : (g.actual_value ?? null);
    const rate  = (actual !== null && g.target_value > 0) ? Math.round(actual / g.target_value * 100) : null;
    const light = getLightFromRate(rate);
    return { ...g, actual, rate, light, isAuto: !!(bm?.autoCompute && g.actual_value == null) };
  });
}

/* ────────────────────────────
   메인 렌더
──────────────────────────── */
function renderPage(bodyEl) {
  const cards = buildCards(currentYM);
  const goals = goalsAll.filter(g => g.year_month === currentYM);
  const achieved = cards.filter(c => c.light === 'green').length;
  const amber    = cards.filter(c => c.light === 'amber').length;
  const red      = cards.filter(c => c.light === 'red').length;
  const missingBuiltin = BUILTIN_METRICS.filter(b => !goals.find(g => g.metric_key === b.key));

  bodyEl.querySelector('#goalsRoot').innerHTML = `
    <div class="month-nav">
      ${viewMode === 'cards' ? `<button id="prevBtn">← 이전 달</button>` : ''}
      ${viewMode === 'cards' ? `<span class="month-label">${fmtYM(currentYM)}</span>` : `<span class="month-label" style="min-width:auto">전체 추세</span>`}
      ${viewMode === 'cards' ? `<button id="nextBtn">다음 달 →</button>` : ''}
      <div style="display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap">
        <div class="view-toggle">
          <button id="btnCards" class="${viewMode==='cards'?'active':''}">📋 카드</button>
          <button id="btnTrend" class="${viewMode==='trend'?'active':''}">📈 추세</button>
        </div>
        ${canEdit && viewMode==='cards' ? `<button class="btn btn-outline btn-sm" id="copyPrevBtn">이전 달 복사</button>` : ''}
        ${canEdit && viewMode==='cards' ? `<button class="btn btn-outline btn-sm" id="addBuiltinBtn">기본 지표 선택</button>` : ''}
        ${canEdit && viewMode==='cards' ? `<button class="btn btn-primary btn-sm" id="addCustomBtn">+ 커스텀</button>` : ''}
      </div>
    </div>

    ${viewMode === 'trend' ? renderTrendView() : renderCardsView(cards, missingBuiltin, achieved, amber, red)}
  `;

  // 공통 이벤트
  bodyEl.querySelector('#btnCards')?.addEventListener('click', () => { viewMode = 'cards'; renderPage(bodyEl); });
  bodyEl.querySelector('#btnTrend')?.addEventListener('click', () => { viewMode = 'trend'; renderPage(bodyEl); });
  bodyEl.querySelector('#trendPrevYear')?.addEventListener('click', () => { trendYear--; renderPage(bodyEl); });
  bodyEl.querySelector('#trendNextYear')?.addEventListener('click', () => { trendYear++; renderPage(bodyEl); });

  if (viewMode === 'cards') {
    bodyEl.querySelector('#prevBtn')?.addEventListener('click', () => { currentYM = shiftMonth(currentYM,-1); renderPage(bodyEl); });
    bodyEl.querySelector('#nextBtn')?.addEventListener('click', () => { currentYM = shiftMonth(currentYM,+1); renderPage(bodyEl); });
    bodyEl.querySelector('#addBuiltinBtn')?.addEventListener('click', () => showBuiltinGoalModal(missingBuiltin));
    bodyEl.querySelector('#addCustomBtn')?.addEventListener('click', () => showCustomGoalModal());
    bodyEl.querySelector('#addCustomCard')?.addEventListener('click', () => showCustomGoalModal());
    bodyEl.querySelector('#copyPrevBtn')?.addEventListener('click', () => copyPrevMonth());

    bodyEl.querySelectorAll('.gc-edit-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const g = goalsAll.find(x => x.id === btn.dataset.id);
        if (g) showEditGoalModal(g);
      });
    });
    bodyEl.querySelectorAll('.gc-del-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteGoal(btn.dataset.id));
    });
  }
}

/* ── 카드뷰 ── */
function renderCardsView(cards, missingBuiltin, achieved, amber, red) {
  return `
    ${cards.length ? `
    <div class="summary-bar">
      <div class="sum-card"><div class="sum-num" style="color:#16a34a">${achieved}</div><div class="sum-label">🟢 달성</div></div>
      <div class="sum-card"><div class="sum-num" style="color:#ca8a04">${amber}</div><div class="sum-label">🟡 근접</div></div>
      <div class="sum-card"><div class="sum-num" style="color:#CC0000">${red}</div><div class="sum-label">🔴 미달</div></div>
      <div class="sum-card"><div class="sum-num">${cards.length}</div><div class="sum-label">전체 항목</div></div>
    </div>` : ''}

    ${cards.length ? `
    <div class="section-title">성과 현황</div>
    <div class="goals-grid">
      ${cards.map(c => goalCard(c)).join('')}
      ${canEdit ? `<div class="add-custom-btn" id="addCustomCard">+ 커스텀 목표 추가</div>` : ''}
    </div>` : `
    <div class="empty-state" style="margin-top:40px">
      <div class="es-icon">🎯</div>
      <p>${fmtYM(currentYM)}에 설정된 목표가 없습니다</p>
      ${canEdit ? `<button class="btn btn-primary" style="margin-top:16px" id="addBuiltinBtn2" onclick="document.getElementById('addBuiltinBtn').click()">+ 목표 추가하기</button>` : ''}
    </div>`}

    ${canEdit && missingBuiltin.length && cards.length ? `
    <div class="section-title" style="margin-top:8px">추가 가능한 기본 지표</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px">
      ${missingBuiltin.map(b => `<span style="font-size:12px;padding:4px 10px;border:1.5px solid var(--border);border-radius:8px;color:#6b7280">${b.icon} ${b.name}</span>`).join('')}
      <button class="btn btn-outline btn-sm" id="addBuiltinBtnInline">한꺼번에 선택 →</button>
    </div>` : ''}
  `;
}

function goalCard(c) {
  const pct = c.rate !== null ? Math.min(c.rate, 120) : 0;
  const barColor = lightColor(c.light);
  const actualDisplay = c.actual !== null
    ? (c.metric_unit === '만원' ? Number(c.actual).toLocaleString('ko-KR') : c.actual)
    : '—';
  const targetDisplay = c.metric_unit === '만원'
    ? Number(c.target_value).toLocaleString('ko-KR')
    : c.target_value;
  const bm = BUILTIN_METRICS.find(b => b.key === c.metric_key);

  return `
  <div class="goal-card light-${c.light}">
    <div class="gc-actions">
      ${canEdit ? `<button class="gc-btn gc-edit-btn" data-id="${c.id}">수정</button>` : ''}
      ${canEdit ? `<button class="gc-btn del gc-del-btn" data-id="${c.id}">삭제</button>` : ''}
    </div>
    <div class="gc-header">
      <div>
        <div class="gc-name">${bm ? bm.icon + ' ' : ''}${c.metric_name}</div>
        <span class="gc-badge ${c.isAuto ? 'auto' : 'custom'}">${c.isAuto ? '자동집계' : '수동입력'}</span>
      </div>
      <div class="gc-light">${lightEmoji(c.light)}</div>
    </div>
    <div class="gc-nums">
      <div class="gc-num-box">
        <div class="gc-num-label">목표</div>
        <div><span class="gc-num-val">${targetDisplay}</span><span class="gc-num-unit">${c.metric_unit}</span></div>
      </div>
      <div class="gc-num-box">
        <div class="gc-num-label">실적</div>
        <div><span class="gc-num-val" style="color:${barColor}">${actualDisplay}</span><span class="gc-num-unit">${c.actual !== null ? c.metric_unit : ''}</span></div>
      </div>
    </div>
    <div class="gc-bar-wrap">
      <div class="gc-bar" style="width:${pct}%;background:${barColor}"></div>
    </div>
    <div class="gc-pct">${c.rate !== null ? c.rate + '%' : '실적 미입력'}</div>
    ${c.notes ? `<div class="gc-notes">${c.notes}</div>` : ''}
  </div>`;
}

/* ── 추세뷰 (연간 12개월) ── */
function renderTrendView() {
  // 연간 12개월 생성
  const months = Array.from({length:12}, (_,i) => `${trendYear}-${String(i+1).padStart(2,'0')}`);
  const todayYM = thisYM();

  // 지표 순서: builtin 우선 → 커스텀
  const usedBuiltin = BUILTIN_METRICS.filter(b => goalsAll.find(g => g.metric_key === b.key));
  const usedCustomKeys = [...new Set(goalsAll.filter(g => g.is_custom).map(g => g.metric_key))];
  const usedKeys = [...usedBuiltin.map(b => b.key), ...usedCustomKeys];

  if (!usedKeys.length && !goalsAll.length) {
    return `<div class="empty-state" style="margin-top:40px"><div class="es-icon">📈</div><p>목표 데이터가 없습니다<br><small style="color:#9ca3af">월별 카드에서 먼저 목표를 추가해 주세요</small></p></div>`;
  }

  // 연도에 데이터가 없는 경우 안내
  const yearHasData = goalsAll.some(g => g.year_month.startsWith(String(trendYear)));

  function cellForKeyMonth(key, ym) {
    const isFuture = ym > todayYM;
    const g = goalsAll.find(g2 => g2.metric_key === key && g2.year_month === ym);
    if (!g) {
      return `<td style="background:${isFuture?'#fafafa':'#f5f5f5'};color:#d1d5db;font-size:11px">
        ${isFuture ? '' : '—'}
      </td>`;
    }
    const bm = BUILTIN_METRICS.find(b => b.key === key);
    const actual = (bm?.autoCompute && g.actual_value == null)
      ? computeActual(key, ym) : (g.actual_value ?? null);
    const rate  = (actual !== null && g.target_value > 0) ? Math.round(actual / g.target_value * 100) : null;
    const light = getLightFromRate(rate);
    const bg = { green:'#f0fdf4', amber:'#fefce8', red:'#fff1f2', gray:'#f9fafb' }[light];
    const actualStr = actual !== null
      ? (g.metric_unit === '만원' ? Number(actual).toLocaleString('ko-KR') : actual)
      : '—';
    const isCur = ym === todayYM;
    return `<td style="background:${bg};${isCur?'outline:2px solid #CC0000;outline-offset:-2px;':''}">
      <div class="trend-cell">
        <div class="tc-signal">${lightEmoji(light)}</div>
        <div class="tc-actual" style="${isCur?'font-weight:900':''}">${actualStr}</div>
        <div class="tc-target">/${g.target_value}${g.metric_unit}</div>
        ${rate !== null ? `<div class="tc-pct">${rate}%</div>` : ''}
      </div>
    </td>`;
  }

  function metricLabel(key) {
    const bm = BUILTIN_METRICS.find(b => b.key === key);
    if (bm) return `<div>${bm.icon} ${bm.name}</div><div class="mc-sub">${bm.unit}</div>`;
    const g = goalsAll.find(g2 => g2.metric_key === key);
    return `<div>⚙ ${g?.metric_name || key}</div><div class="mc-sub">${g?.metric_unit || ''}</div>`;
  }

  const MO = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

  return `
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap">
    <button class="btn btn-outline btn-sm" id="trendPrevYear">← ${trendYear-1}년</button>
    <span style="font-size:17px;font-weight:900">${trendYear}년 연간 목표 현황</span>
    <button class="btn btn-outline btn-sm" id="trendNextYear">${trendYear+1}년 →</button>
    <span style="font-size:11px;color:#9ca3af;margin-left:4px">빨간 테두리 = 현재 월</span>
  </div>
  ${!yearHasData ? `<div style="text-align:center;padding:24px;color:#9ca3af;font-size:13px">${trendYear}년에 설정된 목표가 없습니다</div>` : ''}
  <div class="trend-wrap">
    <table class="trend-table">
      <thead>
        <tr>
          <th class="metric-col">지표</th>
          ${months.map((ym,i) => {
            const isCur = ym === todayYM;
            const hasGoal = goalsAll.some(g => g.year_month === ym);
            return `<th style="${isCur?'background:#fff0f0;color:#CC0000;font-weight:900':hasGoal?'':'color:#d1d5db'}">${MO[i]}</th>`;
          }).join('')}
        </tr>
      </thead>
      <tbody>
        ${usedKeys.map(key => `
        <tr>
          <td class="metric-col">${metricLabel(key)}</td>
          ${months.map(ym => cellForKeyMonth(key, ym)).join('')}
        </tr>`).join('')}
      </tbody>
    </table>
  </div>
  `;
}

/* ────────────────────────────
   기본 지표 다중선택 모달
──────────────────────────── */
function showBuiltinGoalModal(missingBuiltin) {
  if (!missingBuiltin.length) {
    alert('이 달에 추가 가능한 기본 지표가 없습니다.\n모든 기본 지표가 이미 설정되어 있습니다.');
    return;
  }

  const modal = createModal(`
    <h2 style="font-size:16px;font-weight:700;margin-bottom:4px">기본 지표 선택</h2>
    <p style="font-size:12px;color:#9ca3af;margin-bottom:16px">원하는 지표를 선택하면 목표값 입력칸이 나타납니다</p>

    <div class="builtin-check-list" id="bcList">
      ${missingBuiltin.map(b => `
      <div class="bc-item" id="bc_${b.key}">
        <label class="bc-header">
          <input type="checkbox" class="bc-check" value="${b.key}" id="chk_${b.key}">
          <span class="bc-icon">${b.icon}</span>
          <span class="bc-name">${b.name}</span>
          <span class="bc-unit">${b.unit}</span>
        </label>
        <div class="bc-desc">${b.desc}</div>
        <div class="bc-target-row">
          <label style="font-size:12px;color:#374151;white-space:nowrap">목표값</label>
          <input type="number" class="form-input bc-target-input" id="tgt_${b.key}" placeholder="숫자 입력" style="max-width:140px">
          <span style="font-size:12px;color:#6b7280">${b.unit}</span>
          <input class="form-input" id="note_${b.key}" placeholder="메모 (선택)" style="max-width:160px">
        </div>
      </div>`).join('')}
    </div>

    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-outline" id="bcCancel">취소</button>
      <button class="btn btn-primary" id="bcSave">선택 항목 저장</button>
    </div>
  `);

  // 체크박스 → 카드 하이라이트
  modal.querySelectorAll('.bc-check').forEach(chk => {
    chk.addEventListener('change', () => {
      modal.querySelector('#bc_' + chk.value).classList.toggle('checked', chk.checked);
    });
  });

  modal.querySelector('#bcCancel').onclick = () => modal.remove();
  modal.querySelector('#bcSave').onclick = async () => {
    const rows = [];
    missingBuiltin.forEach(b => {
      const chk = modal.querySelector('#chk_' + b.key);
      if (!chk?.checked) return;
      const tgt = Number(modal.querySelector('#tgt_' + b.key)?.value);
      if (!tgt) return;
      const note = modal.querySelector('#note_' + b.key)?.value.trim() || null;
      rows.push({
        year_month: currentYM, metric_key: b.key, metric_name: b.name,
        metric_unit: b.unit, target_value: tgt, actual_value: null,
        is_custom: false, notes: note,
      });
    });
    if (!rows.length) { alert('저장할 항목이 없습니다.\n체크 후 목표값을 입력해 주세요.'); return; }
    const { error } = await getSb().from('chapter_goals').upsert(rows, { onConflict:'year_month,metric_key' });
    if (error) { alert('저장 오류: ' + error.message); return; }
    modal.remove();
    await reload();
    renderPage(document.querySelector('[data-goals-body]'));
  };
}

function showCustomGoalModal() {

    <h2 style="font-size:16px;font-weight:700;margin-bottom:20px">커스텀 목표 추가</h2>
    <div class="form-row2">
      <div class="form-group">
        <label class="form-label">지표명</label>
        <input id="customName" class="form-input" placeholder="예: 신규 멤버 수">
      </div>
      <div class="form-group">
        <label class="form-label">단위</label>
        <input id="customUnit" class="form-input" placeholder="명 / % / 건">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">목표값</label>
      <input type="number" id="targetVal" class="form-input" placeholder="숫자 입력">
    </div>
    <div class="form-group">
      <label class="form-label">실적값 (수동 입력)</label>
      <input type="number" id="actualVal" class="form-input" placeholder="미입력 시 빈칸">
    </div>
    <div class="form-group">
      <label class="form-label">메모 (선택)</label>
      <input id="notesVal" class="form-input" placeholder="참고사항">
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:4px">
      <button class="btn btn-outline" id="modalCancel">취소</button>
      <button class="btn btn-primary" id="modalSave">저장</button>
    </div>
  `);

  modal.querySelector('#modalCancel').onclick = () => modal.remove();
  modal.querySelector('#modalSave').onclick = async () => {
    const metric_name = modal.querySelector('#customName').value.trim();
    const metric_unit = modal.querySelector('#customUnit').value.trim() || '';
    const target_value = Number(modal.querySelector('#targetVal').value);
    if (!metric_name || !target_value) { alert('지표명과 목표값을 입력해 주세요.'); return; }
    const actual_raw = modal.querySelector('#actualVal').value;
    const actual_value = actual_raw !== '' ? Number(actual_raw) : null;
    const notes = modal.querySelector('#notesVal').value.trim() || null;
    const metric_key = 'custom_' + Date.now();

    const { error } = await getSb().from('chapter_goals').insert({
      year_month: currentYM, metric_key, metric_name, metric_unit,
      target_value, actual_value, notes, is_custom: true,
    });
    if (error) { alert('저장 오류: ' + error.message); return; }
    modal.remove();
    await reload();
    renderPage(document.querySelector('[data-goals-body]'));
  };
}

/* ── 기존 목표 수정 ── */
function showEditGoalModal(existing) {
  const bm = BUILTIN_METRICS.find(b => b.key === existing.metric_key);
  const modal = createModal(`
    <h2 style="font-size:16px;font-weight:700;margin-bottom:20px">${bm ? bm.icon + ' ' : ''}${existing.metric_name} 수정</h2>
    ${existing.is_custom ? `
    <div class="form-row2">
      <div class="form-group">
        <label class="form-label">지표명</label>
        <input id="customName" class="form-input" value="${existing.metric_name}">
      </div>
      <div class="form-group">
        <label class="form-label">단위</label>
        <input id="customUnit" class="form-input" value="${existing.metric_unit}">
      </div>
    </div>` : ''}
    <div class="form-group">
      <label class="form-label">목표값</label>
      <input type="number" id="targetVal" class="form-input" value="${existing.target_value}">
    </div>
    ${existing.is_custom ? `
    <div class="form-group">
      <label class="form-label">실적값 (수동 입력)</label>
      <input type="number" id="actualVal" class="form-input" value="${existing.actual_value ?? ''}">
    </div>` : ''}
    <div class="form-group">
      <label class="form-label">메모 (선택)</label>
      <input id="notesVal" class="form-input" value="${existing.notes||''}">
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:4px">
      <button class="btn btn-outline" id="modalCancel">취소</button>
      <button class="btn btn-primary" id="modalSave">저장</button>
    </div>
  `);

  modal.querySelector('#modalCancel').onclick = () => modal.remove();
  modal.querySelector('#modalSave').onclick = async () => {
    const target_value = Number(modal.querySelector('#targetVal').value);
    if (!target_value) { alert('목표값을 입력해 주세요.'); return; }
    const metric_name = existing.is_custom ? modal.querySelector('#customName')?.value.trim() : existing.metric_name;
    const metric_unit = existing.is_custom ? modal.querySelector('#customUnit')?.value.trim() : existing.metric_unit;
    const actual_raw  = modal.querySelector('#actualVal')?.value;
    const actual_value = actual_raw !== undefined && actual_raw !== '' ? Number(actual_raw) : null;
    const notes = modal.querySelector('#notesVal').value.trim() || null;

    const { error } = await getSb().from('chapter_goals').update({
      metric_name, metric_unit, target_value, actual_value, notes,
    }).eq('id', existing.id);
    if (error) { alert('저장 오류: ' + error.message); return; }
    modal.remove();
    await reload();
    renderPage(document.querySelector('[data-goals-body]'));
  };
}

/* ── 삭제 ── */
async function deleteGoal(id) {
  if (!confirm('이 목표 항목을 삭제하시겠습니까?')) return;
  const { error } = await getSb().from('chapter_goals').delete().eq('id', id);
  if (error) { alert('삭제 오류: ' + error.message); return; }
  await reload();
  renderPage(document.querySelector('[data-goals-body]'));
}

/* ── 이전 달 목표 복사 ── */
async function copyPrevMonth() {
  const prev = shiftMonth(currentYM, -1);
  const prevGoals = goalsAll.filter(g => g.year_month === prev);
  if (!prevGoals.length) { alert(`${fmtYM(prev)}에 설정된 목표가 없습니다.`); return; }
  if (!confirm(`${fmtYM(prev)} 목표를 ${fmtYM(currentYM)}으로 복사하시겠습니까?`)) return;
  const rows = prevGoals.map(g => ({
    year_month: currentYM, metric_key: g.metric_key, metric_name: g.metric_name,
    metric_unit: g.metric_unit, target_value: g.target_value, is_custom: g.is_custom,
    notes: g.notes, actual_value: null,
  }));
  const { error } = await getSb().from('chapter_goals').upsert(rows, { onConflict:'year_month,metric_key' });
  if (error) { alert('복사 오류: ' + error.message); return; }
  await reload();
  renderPage(document.querySelector('[data-goals-body]'));
}

/* ── 데이터 로드 ── */
async function reload() {
  const [gRes, wRes] = await Promise.all([
    getSb().from('chapter_goals').select('*').order('sort_order').order('created_at'),
    getSb().from('weekly_records').select('*'),
  ]);
  goalsAll  = gRes.data || [];
  weeklyAll = wRes.data || [];
}

/* ── 모달 헬퍼 ── */
function createModal(html) {
  const m = document.createElement('div');
  m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto';
  m.innerHTML = `<div style="background:#fff;border-radius:14px;padding:28px;width:100%;max-width:520px;margin:auto">${html}</div>`;
  document.body.appendChild(m);
  m.addEventListener('click', e => { if (e.target === m) m.remove(); });
  return m;
}

/* ── 초기화 ── */
document.addEventListener('DOMContentLoaded', async () => {
  const layout = renderPortalLayout({ title: '챕터 목표 관리' });
  if (!layout) return;
  const { session, bodyEl } = layout;
  canEdit = canManageMembers(session);

  bodyEl.setAttribute('data-goals-body', '');
  bodyEl.innerHTML = `
    <div class="page-header">
      <div>
        <h1>챕터 목표 관리</h1>
        <p>의장단이 설정한 월별 목표와 실적 현황</p>
      </div>
    </div>
    <div id="goalsRoot"><div style="text-align:center;padding:48px;color:#9ca3af">불러오는 중...</div></div>
  `;

  currentYM = thisYM();
  await reload();
  renderPage(bodyEl);
});
</script>
