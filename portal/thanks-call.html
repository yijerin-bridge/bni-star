<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>감사콜 — BNI STAR Portal</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/portal/css/portal.css">
  <style>
    .tc-sum { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:16px; }
    .tc-sum-card { background:#fff; border:1.5px solid var(--border); border-radius:12px; padding:14px 16px; }
    .tc-sum-num { font-size:24px; font-weight:900; line-height:1.2; }
    .tc-sum-num small { font-size:13px; font-weight:500; color:#9ca3af; }
    .tc-sum-label { font-size:12px; color:#6b7280; margin-top:2px; }

    .tc-linkbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:#fff; border:1.5px solid var(--border); border-radius:12px; padding:12px 16px; margin-bottom:16px; }
    .tc-linkbar code { flex:1; min-width:200px; font-size:12px; color:#6b7280; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    .tc-wrap { overflow-x:auto; border:1.5px solid var(--border); border-radius:12px; background:#fff; }
    .tc-table { border-collapse:separate; border-spacing:0; font-size:12.5px; width:100%; }
    .tc-table th, .tc-table td { padding:8px 6px; border-bottom:1px solid #f0f0f0; text-align:center; white-space:nowrap; }
    .tc-table thead th { background:#f9fafb; font-weight:700; font-size:11.5px; color:#6b7280; position:sticky; top:0; }
    .tc-table th.cur { background:#fff0f0; color:#CC0000; }
    .tc-table .name { position:sticky; left:0; background:#fff; text-align:left; font-weight:700; padding-left:14px; z-index:1; border-right:1px solid #f0f0f0; }
    .tc-table thead .name { background:#f9fafb; z-index:2; }
    .tc-table .name a { color:inherit; text-decoration:none; }
    .tc-table .name a:hover { color:#CC0000; text-decoration:underline; }
    .tc-table th small { display:block; font-weight:400; font-size:10px; color:#9ca3af; }
    .tc-cell { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:7px; font-size:11px; font-weight:700; }
    .tc-cell.done { background:#16a34a; color:#fff; cursor:help; }
    .tc-cell.half { background:#bbf7d0; color:#166534; cursor:help; }
    .tc-cell.miss { background:#fee2e2; color:#CC0000; }
    .tc-cell.wait { background:#f3f4f6; color:#9ca3af; }
    .tc-cell.future { background:transparent; color:#e5e7eb; }
    .tc-legend { display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:#6b7280; margin:10px 2px 24px; align-items:center; }
    .tc-legend span { display:inline-flex; align-items:center; gap:5px; }
    .tc-legend .tc-cell { width:16px; height:16px; border-radius:4px; font-size:9px; }

    .tc-recent { width:100%; border-collapse:collapse; font-size:13px; }
    .tc-recent th { text-align:left; font-size:11.5px; color:#6b7280; padding:8px 10px; background:#f9fafb; }
    .tc-recent td { padding:9px 10px; border-top:1px solid #f0f0f0; }
    .tc-notice { background:#fff7ed; border:1.5px solid #fdba74; color:#9a3412; border-radius:12px; padding:14px 16px; font-size:13.5px; margin-bottom:16px; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/members-data.js"></script>
<script src="/portal/js/portal-auth.js"></script>
<script src="/portal/js/portal-nav.js"></script>
<script src="/portal/js/thanks-call-core.js"></script>
<script src="/portal/js/thanks-call-board.js"></script>
</body>
</html>
