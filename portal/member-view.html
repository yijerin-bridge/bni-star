<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BNI STAR — 멤버 현황</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Noto Sans KR',sans-serif;font-size:14px;background:#f0f2f5;color:#111827;padding:20px 16px}
    .wrap{max-width:720px;margin:0 auto}
    .hdr{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
    .hdr-logo{font-size:15px;font-weight:900;color:#CC0000}
    .hdr-name{font-size:20px;font-weight:900}
    .hdr-co{font-size:12px;color:#9ca3af}
    .ro-tag{margin-left:auto;font-size:11px;color:#9ca3af;background:#f3f4f6;padding:3px 10px;border-radius:20px}
    .card{background:#fff;border-radius:12px;border:1px solid #e5e7eb;padding:18px;margin-bottom:14px}
    .card-title{font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
    .score-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
    .si{background:#f9fafb;border-radius:8px;padding:9px 11px}
    .si-label{font-size:10px;color:#9ca3af;margin-bottom:1px}
    .si-val{font-size:15px;font-weight:700}
    .si-max{font-size:11px;font-weight:400;color:#9ca3af}
    .si-detail{font-size:10px;color:#9ca3af;margin-top:2px}
    .tbl{width:100%;border-collapse:collapse;font-size:12px}
    .tbl th{background:#f9fafb;padding:7px 8px;text-align:center;font-size:10px;font-weight:700;color:#6b7280;border-bottom:2px solid #e5e7eb;white-space:nowrap}
    .tbl td{padding:7px 8px;text-align:center;border-bottom:1px solid #f3f4f6}
    .tbl td:first-child,.tbl th:first-child{text-align:left}
    .tbl tr.fut td{color:#9ca3af;font-style:italic}
    .ai-tip{padding:9px 13px;border-radius:8px;font-size:12px;line-height:1.6;display:flex;gap:9px;margin-bottom:6px}
    .ai-tip.positive{background:#f0fdf4}.ai-tip.warning{background:#fefce8}
    .ai-tip.action{background:#eff6ff}.ai-tip.critical{background:#fff1f2}
    .footer{text-align:center;font-size:11px;color:#d1d5db;margin-top:24px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <span class="hdr-logo">BNI ★ STAR</span>
    <span class="hdr-name" id="hdrName">—</span>
    <span class="hdr-co" id="hdrCo"></span>
    <span class="ro-tag">🔒 읽기 전용</span>
    <button onclick="saveMemberImage()" style="margin-left:8px;padding:4px 12px;font-size:12px;border:1.5px solid #e5e7eb;border-radius:20px;background:#fff;cursor:pointer;font-family:inherit" id="imgBtn">📸 이미지 저장</button>
  </div>
  <div id="root"><div style="text-align:center;padding:60px;color:#9ca3af">불러오는 중...</div></div>
  <div class="footer">BNI STAR Portal · 읽기 전용 공유 링크</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script>
/* ── 최소 유틸 (traffic-light.js 의존 제거) ── */
const CHAPTER_LAUNCH = '2026-05-13';
const TODAY = new Date().toISOString().slice(0,10);

function getAllWeeks() {
  const start = new Date(CHAPTER_LAUNCH + 'T00:00:00Z');
  const minEnd = new Date(start); minEnd.setUTCDate(minEnd.getUTCDate() + 23*7);
  const target = new Date(TODAY + 'T00:00:00Z');
  const end = target > minEnd ? target : minEnd;
  const weeks = []; let d = new Date(start);
  while (d <= end) { weeks.push(d.toISOString().slice(0,10)); d.setUTCDate(d.getUTCDate()+7); }
  return weeks;
}
const WEEKS_ALL = getAllWeeks();

function get6MonthWindow() {
  const t = new Date();
  const end   = new Date(t.getFullYear(), t.getMonth(), 0);
  const start = new Date(t.getFullYear(), t.getMonth() - 6, 1);
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return { start: fmt(start), end: fmt(end) };
}

function getMemberWeeks(joinedDate) {
  const joinStr = joinedDate || CHAPTER_LAUNCH;
  const firstWeek = WEEKS_ALL.find(w => w >= joinStr) || WEEKS_ALL[0];
  const startIdx  = WEEKS_ALL.indexOf(firstWeek);
  const minEnd = new Date(firstWeek+'T00:00:00Z'); minEnd.setUTCDate(minEnd.getUTCDate()+23*7);
  const ext = [...WEEKS_ALL]; let last = new Date(ext[ext.length-1]+'T00:00:00Z');
  while (last < minEnd) { last.setUTCDate(last.getUTCDate()+7); ext.push(last.toISOString().slice(0,10)); }
  return ext.slice(startIdx);
}

const ANNUAL_MEMBERSHIP = 1600000;
function scoreAttendance(recs) { if(!recs.length)return 0; const rate=recs.filter(r=>!r.absent).length/recs.length; return rate>=0.95?10:rate>=0.88?5:0; }
function scoreReferral(a) { return a<0.25?0:a<0.5?5:a<0.75?10:a<1.0?15:a<1.25?20:25; }
function scoreTyfcb(t)    { const m=t/ANNUAL_MEMBERSHIP; return m<=0?0:m<2?1:m<5?2:m<15?3:m<30?4:5; }
function scoreVisitor(t)  { return t>=5?25:t>=4?20:t>=3?15:t>=2?10:t>=1?5:0; }
function scoreOno(a)      { return a<0.25?0:a<0.5?5:a<0.75?10:a<1.0?15:20; }
function scoreCeu(a)      { return a<=0?0:a<0.5?5:10; }
function scoreSponsored(n){ return n>=1?5:0; }
function fmtComma(v)      { return (Number(v)||0).toLocaleString('ko-KR'); }

function calcMemberScore(recs, pastWeeks) {
  const n = recs.length;
  if (!n) return {total:0,light:'gray',breakdown:{attendance:0,referral:0,tyfcb:0,visitor:0,ono:0,ceu:0,sponsored:0},stats:{n:0,absN:0,lateN:0,totRef:0,totVis:0,totOno:0,totTyf:0,totCeu:0,totSponsored:0,attendRate:1,avgRef:'0.00',avgOno:'0.00',avgCeu:'0.00',tyfcbMult:'0.0'}};
  const absN=recs.filter(r=>r.absent).length, lateN=recs.filter(r=>r.late).length;
  const totRef=recs.reduce((s,r)=>s+(r.given_t1||0)+(r.given_t2||0),0);
  const totVis=recs.reduce((s,r)=>s+(r.visitors||0),0);
  const totOno=recs.reduce((s,r)=>s+(r.one_on_one||0),0);
  const totTyf=recs.reduce((s,r)=>s+(Number(r.tyfcb)||0),0);
  const totCeu=recs.reduce((s,r)=>s+(r.ceu||0),0);
  const totSponsored=recs.reduce((s,r)=>s+(r.sponsored||0),0);
  const W=Math.max(pastWeeks!=null?pastWeeks:n,1);
  const attendRate=recs.filter(r=>!r.absent).length/n;
  const s1=scoreAttendance(recs),s2=scoreReferral(totRef/W);
  const s3=scoreTyfcb(totTyf),s4=scoreVisitor(totVis),s5=scoreOno(totOno/W),s6=scoreCeu(totCeu/W),s7=scoreSponsored(totSponsored);
  const total=s1+s2+s3+s4+s5+s6+s7;
  return {total,light:total>=70?'green':total>=50?'amber':total>=30?'red':'gray',
    breakdown:{attendance:s1,referral:s2,tyfcb:s3,visitor:s4,ono:s5,ceu:s6,sponsored:s7},
    stats:{n,absN,lateN,totRef,totVis,totOno,totTyf,totCeu,totSponsored,attendRate,
      avgRef:(totRef/W).toFixed(2),avgOno:(totOno/W).toFixed(2),
      avgCeu:(totCeu/W).toFixed(2),tyfcbMult:(totTyf/ANNUAL_MEMBERSHIP).toFixed(1)}};
}

function genAITips(name, sc) {
  const tips = [];
  const lMsg = {
    green:  '모든 항목 기준 충족 — 챕터의 모범이 되고 있습니다! 이 활동을 유지해 주세요.',
    amber:  'Green까지 한 걸음 남았습니다. 아래 항목만 집중하면 달성 가능합니다.',
    red:    '활동 강화가 필요합니다. 트래픽라이트위원·원투원코디·멘토링코디와 면담을 통해 실천 계획을 세워보세요.',
    gray:   `${name}님의 BNI 활동이 저조합니다. 지금 바로 리퍼럴·1:1·비지터 활동을 시작해 보세요!`,
  };
  tips.push({
    type: {green:'positive',amber:'warning',red:'critical',gray:'critical'}[sc.light]||'warning',
    icon: {green:'✅',amber:'⚠️',red:'🚨',gray:'🔔'}[sc.light],
    text: `현재 ${sc.total}점 · ${lMsg[sc.light]}`,
  });
  if (sc.breakdown.attendance < 10) {
    const rate = Math.round((sc.stats.attendRate??1)*100);
    tips.push({type:'action',icon:'📅',text:`출석률 ${rate}% (결석 ${sc.stats.absN}회) — 출석률 95% 이상이면 만점(10점)입니다. 불가피한 결석엔 반드시 대리인을 보내세요.`});
  }
  if (sc.breakdown.referral < 25) {
    const avg = parseFloat(sc.stats.avgRef)||0;
    const next = avg<0.25?'주 0.25건':avg<0.5?'주 0.5건':avg<0.75?'주 0.75건':avg<1.0?'주 1건':'주 1.25건';
    tips.push({type:'action',icon:'🤝',text:`리퍼럴 주평균 ${sc.stats.avgRef}건 → 목표 ${next}. 1:1 상대 중 지금 바로 소개해 줄 수 있는 분을 떠올려 보세요.`});
  }
  if (sc.breakdown.visitor < 25) {
    const tot = sc.stats.totVis||0;
    const nextLevel = tot<1?'1명':tot<2?'2명':tot<3?'3명':tot<4?'4명':'5명';
    tips.push({type:'action',icon:'🙋',text:`비지터 6개월 총 ${tot}명 — ${tot===0?'아직 비지터 초대가 없습니다. 지금 바로 주변 1명에게 연락해 보세요!':`다음 목표 ${nextLevel}명입니다. 꾸준히 초대를 이어가세요.`}`});
  }
  if (sc.breakdown.ono < 20) {
    const avg = parseFloat(sc.stats.avgOno)||0;
    const next = avg<0.25?'주 0.25회':avg<0.5?'주 0.5회':avg<0.75?'주 0.75회':'주 1회';
    tips.push({type:'action',icon:'☕',text:`1:1 주평균 ${sc.stats.avgOno}회 — ${avg===0?'아직 1:1 미팅 기록이 없습니다. 이번 주 첫 1:1을 잡아보세요!':`목표는 주 1회(20점 만점)입니다. 목표 ${next} 달성을 위해 미팅 후 바로 다음 약속을 잡으세요.`}`});
  }
  if (sc.breakdown.tyfcb < 5) {
    const mult = parseFloat(sc.stats.tyfcbMult)||0;
    tips.push({type:'action',icon:'💰',text:`TYFCB ${sc.stats.tyfcbMult}배 (${fmtComma(sc.stats.totTyf)}원) — 받은 리퍼럴이 성사될 때마다 즉시 감사장을 기록하세요. ${mult===0?'아직 감사장 기록이 없습니다.':'30배(5점) 달성을 목표로 하세요.'}`});
  }
  if (sc.breakdown.ceu < 10)
    tips.push({type:'action',icon:'📚',text:`CEU 주평균 ${sc.stats.avgCeu}/주 — 교육 세션 참여 시 빠짐없이 기록해 주세요. 주당 0.5 이상이면 만점(10점)입니다.`});
  if (sc.breakdown.sponsored < 5)
    tips.push({type:'action',icon:'🤲',text:`스폰서 ${sc.stats.totSponsored||0}명 — 신규 멤버를 가입 추천하면 5점이 추가됩니다. 주변에 BNI에 맞는 분이 있다면 소개해 보세요.`});
  return tips;
}

/* ── 메인 ── */
(async () => {
  const name = new URLSearchParams(location.search).get('name') || '';
  if (!name) { showErr('?name=홍길동 형식으로 접근하세요.'); return; }
  document.getElementById('hdrName').textContent = decodeURIComponent(name);
  document.title = `${decodeURIComponent(name)} — BNI STAR`;

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  const [{ data: members }, { data: recs }] = await Promise.all([
    sb.from('members').select('name,company,joined_date').eq('name', decodeURIComponent(name)).limit(1),
    sb.from('weekly_records').select('*').eq('member_name', decodeURIComponent(name)).order('week_date'),
  ]);

  const nm      = decodeURIComponent(name);
  const member  = members?.[0];
  document.getElementById('hdrCo').textContent = member?.company || '';

  const win6     = get6MonthWindow();
  const effStart = [win6.start, CHAPTER_LAUNCH, member?.joined_date || CHAPTER_LAUNCH].sort().reverse()[0];
  const isShort  = effStart > win6.start;
  const allRecs  = recs || [];
  const extraRecs = allRecs.filter(r => r.week_date > win6.end);
  const hasExtra  = extraRecs.length > 0;
  const isPreview = hasExtra || isShort;
  const previewEnd = hasExtra ? TODAY : win6.end;
  const winRecs  = allRecs.filter(r => r.week_date >= effStart && r.week_date <= previewEnd);
  const memWeeks = getMemberWeeks(member?.joined_date);
  const denom    = Math.max(WEEKS_ALL.filter(w => w >= effStart && w <= previewEnd).length, new Set(winRecs.map(r=>r.week_date)).size, 1);
  const sc       = calcMemberScore(winRecs, denom);
  const lEmoji   = {green:'🟢',amber:'🟡',red:'🔴',gray:'⚫'}[sc.light]||'⚫';
  const lColor   = {green:'#16a34a',amber:'#ca8a04',red:'#CC0000',gray:'#9ca3af'}[sc.light];
  const isNew    = member?.joined_date && member.joined_date > CHAPTER_LAUNCH;

  const scoreItems = [
    ['출석',          sc.breakdown.attendance, 10, `출석률 ${Math.round((sc.stats.attendRate??1)*100)}% (결석 ${sc.stats.absN||0}회)`,   '95%+=10 / 88%+=5 / 미만=0'],
    ['리퍼럴',        sc.breakdown.referral,   25, `주평균 ${sc.stats.avgRef||'0.00'}건`,                                               '1.25+건=25 / 1.0+=20 / 0.75+=15 / 0.5+=10 / 0.25+=5'],
    ['비지터',        sc.breakdown.visitor,    25, `6개월 총 ${sc.stats.totVis||0}명`,                                                  '5명+=25 / 4명=20 / 3명=15 / 2명=10 / 1명=5'],
    ['1:1',          sc.breakdown.ono,        20, `주평균 ${sc.stats.avgOno||'0.00'}회`,                                               '1.0+회=20 / 0.75+=15 / 0.5+=10 / 0.25+=5'],
    ['교육(CEU)',     sc.breakdown.ceu,        10, `주평균 ${sc.stats.avgCeu||'0.00'}/주`,                                              '0.5+/주=10 / 0초과=5 / 0=0'],
    ['감사장(TYFCB)', sc.breakdown.tyfcb,       5, `${sc.stats.tyfcbMult||'0.0'}배 · ${fmtComma(sc.stats.totTyf||0)}원`,              '30배+=5 / 15배+=4 / 5배+=3 / 2배+=2 / 0초과=1'],
    ['스폰서',        sc.breakdown.sponsored,   5, `${sc.stats.totSponsored||0}명 신규 추천`,                                          '1명 이상=5 / 0명=0'],
  ];

  const tips = genAITips(nm, sc);
  const recMap = Object.fromEntries((recs||[]).map(r=>[r.week_date,r]));
  const attendLbl = r => !r?'—':r.absent?'❌결석':r.late?'⚠️지각/조퇴':r.substitute?'🔄대리인':r.sick?'🏥병가':'✅출석';

  document.getElementById('root').innerHTML = `
    <div class="card" style="border-left:4px solid ${lColor}">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap">
        <span style="font-size:34px;font-weight:900">${sc.total}</span>
        <span style="font-size:22px">${lEmoji}</span>
        <span style="font-size:12px;color:#6b7280">
          ${effStart} ~ ${previewEnd} · ${denom}주 기준
          ${isPreview ? '<span style="background:#fef9c3;color:#713f12;font-size:11px;padding:2px 7px;border-radius:10px;margin-left:4px">예상 점수</span>' : ''}
        </span>
      </div>
      <div class="score-grid">
        ${scoreItems.map(([label,score,max,detail,crit])=>`
          <div class="si">
            <div class="si-label" title="${crit}">${label} <span style="color:#d1d5db">?</span></div>
            <div class="si-val">${score}<span class="si-max">/${max}</span></div>
            <div class="si-detail">${detail}</div>
          </div>`).join('')}
      </div>
    </div>

    ${tips.length?`<div class="card">
      <div class="card-title">🤖 개선방향</div>
      ${tips.map(t=>`<div class="ai-tip ${t.type}"><span>${t.icon}</span><span>${t.text}</span></div>`).join('')}
    </div>`:''}

    <div class="card">
      <div class="card-title">24주 주간 기록</div>
      <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr><th>주차</th><th>날짜</th><th>출결</th><th>준T1</th><th>준T2</th><th>받은T1</th><th>받은T2</th><th>비지터</th><th>1:1</th><th>감사장</th><th>CEU</th></tr></thead>
          <tbody>${memWeeks.map((w,i)=>{
            const r=recMap[w];
            return `<tr class="${w>TODAY?'fut':''}">
              <td style="font-weight:600">W${i+1}</td><td>${w}</td><td>${attendLbl(r)}</td>
              <td>${r?.given_t1??'—'}</td><td>${r?.given_t2??'—'}</td>
              <td>${r?.received_t1??'—'}</td><td>${r?.received_t2??'—'}</td>
              <td>${r?.visitors??'—'}</td><td>${r?.one_on_one??'—'}</td>
              <td>${r?fmtComma(r.tyfcb||0):'—'}</td><td>${r?.ceu??'—'}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
    </div>
  `;
})();

function showErr(msg){document.getElementById('root').innerHTML=`<div style="background:#fee2e2;border:1px solid #fca5a5;color:#7f1d1d;padding:16px;border-radius:10px">${msg}</div>`;}

async function saveMemberImage() {
  const btn = document.getElementById('imgBtn');
  btn.disabled = true; btn.textContent = '저장 중...';
  try {
    const name = new URLSearchParams(location.search).get('name') || 'member';
    const canvas = await html2canvas(document.querySelector('.wrap'), { scale: 2, useCORS: true, backgroundColor: '#f0f2f5' });
    const link = document.createElement('a');
    link.download = `BNI-STAR-${name}-${new Date().toISOString().slice(0,10)}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } finally {
    btn.disabled = false; btn.textContent = '📸 이미지 저장';
  }
}
</script>
</body>
</html>
