<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BNI STAR — 멤버 현황</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #CC0000; --green: #16a34a; --yellow: #ca8a04;
      --border: #e5e7eb; --bg: #f0f2f5; --card: #fff; --text: #111827; --muted: #6b7280;
    }
    body { font-family: 'Noto Sans KR', sans-serif; font-size: 14px; background: var(--bg); color: var(--text); padding: 24px 16px; }
    .wrap { max-width: 720px; margin: 0 auto; }

    /* header */
    .hdr { display:flex; align-items:center; gap:12px; margin-bottom:24px; }
    .hdr-logo { font-size:17px; font-weight:900; color:var(--red); }
    .hdr-name  { font-size:22px; font-weight:900; }
    .hdr-badge { font-size:11px; background:#fee2e2; color:#7f1d1d; padding:2px 10px; border-radius:20px; font-weight:600; }
    .readonly-tag { margin-left:auto; font-size:11px; color:var(--muted); background:#f3f4f6; padding:3px 10px; border-radius:20px; }

    /* card */
    .card { background:var(--card); border-radius:12px; border:1px solid var(--border); padding:20px; margin-bottom:16px; }
    .card-title { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:14px; }

    /* score breakdown */
    .score-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
    .score-item { background:#f9fafb; border-radius:8px; padding:10px 12px; }
    .score-label { font-size:10px; color:var(--muted); margin-bottom:2px; }
    .score-val   { font-size:16px; font-weight:700; }
    .score-max   { font-size:11px; font-weight:400; color:var(--muted); }
    .score-detail{ font-size:10px; color:var(--muted); margin-top:2px; }

    /* light badge */
    .light-green  { color:var(--green); }
    .light-yellow { color:var(--yellow); }
    .light-red    { color:var(--red); }
    .light-gray   { color:#9ca3af; }

    /* week table */
    .tbl { width:100%; border-collapse:collapse; font-size:12px; }
    .tbl th { background:#f9fafb; padding:8px 10px; text-align:center; font-size:10px; font-weight:700; color:var(--muted); border-bottom:2px solid var(--border); white-space:nowrap; }
    .tbl td { padding:8px 10px; text-align:center; border-bottom:1px solid #f3f4f6; }
    .tbl td:first-child, .tbl th:first-child { text-align:left; }
    .tbl tr.future td { color:#9ca3af; font-style:italic; }

    /* AI tips */
    .ai-tip { padding:10px 14px; border-radius:8px; font-size:13px; line-height:1.6; display:flex; gap:10px; margin-bottom:7px; }
    .ai-tip.positive { background:#f0fdf4; }
    .ai-tip.warning  { background:#fefce8; }
    .ai-tip.action   { background:#eff6ff; }
    .ai-tip.critical { background:#fff1f2; }

    /* footer */
    .footer { text-align:center; font-size:11px; color:#d1d5db; margin-top:32px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <span class="hdr-logo">BNI ★ STAR</span>
    <span class="hdr-name" id="hdrName">—</span>
    <span class="hdr-badge" id="hdrBadge"></span>
    <span class="readonly-tag">🔒 읽기 전용</span>
  </div>

  <div id="mainContent">
    <div style="text-align:center;padding:60px 0;color:#9ca3af">불러오는 중...</div>
  </div>

  <div class="footer">BNI STAR Portal · 읽기 전용 공유 링크</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/portal/js/traffic-light.js"></script>
<script>
const CHAPTER_LAUNCH = '2026-05-13';
const TODAY = new Date().toISOString().slice(0,10);

(async () => {
  const params = new URLSearchParams(location.search);
  const name   = params.get('name') || params.get('n') || '';
  if (!name) { showError('이름 파라미터가 없습니다. ?name=홍길동 형식으로 접근하세요.'); return; }

  document.getElementById('hdrName').textContent = name;
  document.title = `${name} — BNI STAR`;

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  const [{ data: members }, { data: recs }] = await Promise.all([
    sb.from('members').select('*').eq('name', name).limit(1),
    sb.from('weekly_records').select('*').eq('member_name', name).order('week_date'),
  ]);

  const member = members?.[0];
  if (!member && !recs?.length) { showError(`"${name}" 멤버를 찾을 수 없습니다.`); return; }

  document.getElementById('hdrBadge').textContent = member?.company || '';

  // 주차 계산
  const memWeeks  = getMemberWeeks(member?.joined_date);
  const elapsed   = memWeeks.filter(w => w <= TODAY).length;
  const recorded  = new Set((recs||[]).map(r => r.week_date)).size;
  const sc        = calcMemberScore(recs||[], Math.max(elapsed, recorded));
  const isNew     = member?.joined_date && member.joined_date > CHAPTER_LAUNCH;

  const lEmoji  = {green:'🟢',yellow:'🟡',red:'🔴',gray:'⚫'}[sc.light]||'⚫';
  const lColor  = {green:'#16a34a',yellow:'#ca8a04',red:'#CC0000',gray:'#9ca3af'}[sc.light]||'#9ca3af';

  const criteria = {
    '결석':      '0번=15 / 1번=10 / 2번=5 / 3번+=0',
    '지각/조퇴': '0번=10 / 1번=5 / 2번+=0',
    '리퍼럴':    '주평균 1.2+건=20 / 1.0+건=15 / 0.75+건=10 / 0.5+건=5 / 미만=0',
    '감사장':    '1억+=15 / 5천만+=10 / 2500만+=5 / 미만=0',
    '비지터':    '주평균 0.6+명=20 / 0.4+명=15 / 0.2+명=10 / 0.1+명=5 / 미만=0',
    '1:1':       '주평균 2+회=10 / 1+회=5 / 미만=0',
    '교육':      '누적 15+점=10 / 5+점=5 / 미만=0',
  };

  const scoreItems = [
    ['결석',     sc.breakdown.absence,  15,  `${sc.stats.absN||0}번`],
    ['지각/조퇴',sc.breakdown.late,     10,  `${sc.stats.lateN||0}번`],
    ['리퍼럴',   sc.breakdown.referral, 20,  `주평균 ${sc.stats.avgRef||'0.00'}건`],
    ['감사장',   sc.breakdown.tyfcb,    15,  fmtComma(sc.stats.totTyf||0)+'원'],
    ['비지터',   sc.breakdown.visitor,  20,  `주평균 ${sc.stats.avgVis||'0.00'}명`],
    ['1:1',      sc.breakdown.ono,      10,  `주평균 ${sc.stats.avgOno||'0.00'}회`],
    ['교육',     sc.breakdown.ceu,      10,  `누적 ${sc.stats.totCeu||0}점`],
  ];

  // AI 피드백
  const tips = genAIMember(name, recs||[], sc);

  // 주간 테이블
  const recMap = Object.fromEntries((recs||[]).map(r=>[r.week_date,r]));
  const hiddenCount = Math.max(0, memWeeks.length - 24);
  const tableRows = memWeeks.map((w, i) => {
    const r = recMap[w];
    const wNum = `W${i+1}`;
    const isFuture = w > TODAY;
    const attendLabel = !r ? '—' : r.absent?'❌결석':r.late?'⚠️지각/조퇴':r.substitute?'🔄대리인':r.sick?'🏥병가':'✅출석';
    return `<tr class="${isFuture?'future':''}">
      <td style="font-weight:600">${wNum}</td>
      <td>${w}</td>
      <td>${attendLabel}</td>
      <td>${r?.given_t1??'—'}</td><td>${r?.given_t2??'—'}</td>
      <td>${r?.received_t1??'—'}</td><td>${r?.received_t2??'—'}</td>
      <td>${r?.visitors??'—'}</td><td>${r?.one_on_one??'—'}</td>
      <td>${r ? fmtComma(r.tyfcb||0) : '—'}</td><td>${r?.ceu??'—'}</td>
    </tr>`;
  }).join('');

  document.getElementById('mainContent').innerHTML = `
    <!-- 점수 카드 -->
    <div class="card" style="border-left:4px solid ${lColor}">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap">
        <span style="font-size:36px;font-weight:900">${sc.total}</span>
        <span style="font-size:24px">${lEmoji}</span>
        <span style="font-size:12px;color:var(--muted)">
          분모 ${Math.max(elapsed,recorded)}주 (경과 ${elapsed} / 기록 ${recorded})
          ${isNew ? ` · 가입 ${member.joined_date}` : ''}
        </span>
      </div>
      <div class="score-grid">
        ${scoreItems.map(([label,score,max,detail])=>`
          <div class="score-item">
            <div class="score-label" title="${criteria[label]||''}">${label} <span style="color:#d1d5db;cursor:help">?</span></div>
            <div class="score-val">${score}<span class="score-max">/${max}</span></div>
            <div class="score-detail">${detail}</div>
          </div>`).join('')}
      </div>
    </div>

    <!-- AI 개선방향 -->
    ${tips.length ? `<div class="card">
      <div class="card-title">🤖 개선방향</div>
      ${tips.map(t=>`<div class="ai-tip ${t.type}"><span>${t.icon}</span><span>${t.text}</span></div>`).join('')}
    </div>` : ''}

    <!-- 주간 기록 -->
    <div class="card">
      <div class="card-title">24주 주간 기록</div>
      <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr>
            <th>주차</th><th>날짜</th><th>출결</th>
            <th>준T1</th><th>준T2</th><th>받은T1</th><th>받은T2</th>
            <th>비지터</th><th>1:1</th><th>감사장</th><th>CEU</th>
          </tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    </div>
  `;
})();

function showError(msg) {
  document.getElementById('mainContent').innerHTML = `<div style="background:#fee2e2;border:1px solid #fca5a5;color:#7f1d1d;padding:16px;border-radius:10px">${msg}</div>`;
}
</script>
</body>
</html>
