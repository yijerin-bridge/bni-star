<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>피처 피드백 — BNI STAR Portal</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/portal/css/portal.css">
  <style>
    .tab-bar { display:flex; gap:0; border:1.5px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:24px; width:fit-content; }
    .tab-bar button { padding:8px 20px; border:none; background:#fff; cursor:pointer; font-size:13px; font-weight:600; font-family:inherit; color:var(--text-muted); transition:.15s; }
    .tab-bar button.active { background:#CC0000; color:#fff; }

    /* 피드백 폼 */
    .ff-card { background:#fff; border:1.5px solid var(--border); border-radius:14px; padding:20px; margin-bottom:12px; }
    .q-label { font-size:14px; font-weight:700; margin-bottom:14px; line-height:1.5; }
    .q-label .req { color:#CC0000; margin-left:2px; }

    .star-group { display:flex; flex-direction:row-reverse; justify-content:flex-end; gap:6px; }
    .star-group input[type=radio] { display:none; }
    .star-group label { font-size:34px; cursor:pointer; color:#e5e7eb; line-height:1; transition:color .1s; }
    .star-group label:hover,
    .star-group label:hover ~ label { color:#f59e0b; }
    .star-group input:checked ~ label { color:#f59e0b; }
    .star-hint { font-size:11px; color:#9ca3af; margin-top:6px; }

    .err-msg { color:#CC0000; font-size:12px; margin-top:6px; display:none; }
    .err-msg.show { display:block; }

    .submit-btn { padding:12px 32px; background:#CC0000; color:#fff; border:none; border-radius:10px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer; transition:.15s; }
    .submit-btn:hover { background:#a00000; }
    .submit-btn:disabled { background:#d1d5db; cursor:not-allowed; }

    /* 결과 */
    .summary-table { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .summary-table th { background:#CC0000; color:#fff; font-size:12px; font-weight:700; padding:10px 14px; text-align:left; }
    .summary-table th:not(:first-child) { text-align:center; }
    .summary-table td { padding:10px 14px; font-size:13px; border-bottom:1px solid var(--border); }
    .summary-table td:not(:first-child) { text-align:center; font-weight:700; }
    .summary-table tr:last-child td { border-bottom:none; }
    .score-chip { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700; }
    .score-high { background:#dcfce7; color:#15803d; }
    .score-mid  { background:#fef9c3; color:#854d0e; }
    .score-low  { background:#fee2e2; color:#b91c1c; }

    .presenter-card { background:#fff; border:1.5px solid var(--border); border-radius:14px; padding:20px; margin-bottom:12px; }
    .pc-header { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
    .pc-name   { font-size:17px; font-weight:900; }
    .pc-meta   { font-size:12px; color:var(--text-muted); }
    .pc-avg    { margin-left:auto; font-size:22px; font-weight:900; color:#CC0000; }
    .pc-avg-sub{ font-size:11px; color:var(--text-muted); text-align:right; }

    .q-row { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
    .q-row-text { font-size:12px; color:#374151; flex:1; min-width:0; }
    .q-bar-wrap { width:120px; height:7px; background:#f3f4f6; border-radius:4px; flex-shrink:0; }
    .q-bar { height:7px; border-radius:4px; background:#CC0000; }
    .q-score { font-size:12px; font-weight:700; width:28px; text-align:right; flex-shrink:0; }

    .comment-list { margin-top:12px; border-top:1px solid var(--border); padding-top:12px; }
    .comment-item { background:#f9fafb; border-radius:8px; padding:10px 12px; margin-bottom:6px; font-size:12px; color:#374151; line-height:1.6; }
    .comment-date { font-size:10px; color:var(--text-muted); margin-bottom:3px; }
    .toggle-btn { font-size:12px; color:#CC0000; background:none; border:none; cursor:pointer; font-family:inherit; font-weight:600; padding:0; margin-top:8px; }

    .share-bar { display:flex; align-items:center; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
    .share-bar select { padding:7px 12px; border:1.5px solid var(--border); border-radius:8px; font-size:13px; font-family:inherit; }
    .share-bar select:focus { outline:none; border-color:#CC0000; }
    .pill-count { background:#CC0000; color:#fff; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; }
    .copy-link-btn { padding:7px 14px; border:1.5px solid var(--border); border-radius:8px; background:#fff; cursor:pointer; font-size:12px; font-weight:600; font-family:inherit; margin-left:auto; }
    .copy-link-btn:hover { border-color:#CC0000; color:#CC0000; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/members-data.js"></script>
<script src="/portal/js/portal-auth.js"></script>
<script src="/portal/js/portal-nav.js"></script>
<script>
/* ── 설정 ── */
const SHARE_TOKEN = 'bni-star-ff';

const QUESTIONS = [
  { key:'q1', text:'어떤 일을 하시는지 잘 이해됐다', short:'이해' },
  { key:'q2', text:'어떤 분을 소개해 드리면 좋을지 떠올랐다', short:'소개 대상' },
  { key:'q3', text:'다른 분들과 구별되는 점이 인상 깊었다', short:'차별점' },
  { key:'q4', text:'"이런 분 소개해 주세요"라는 요청이 구체적으로 전달됐다', short:'소개 요청' },
  { key:'q5', text:'발표를 들으며 떠오르는 분이 있었다', short:'떠오름' },
  { key:'q6', text:'믿을 수 있는 분이라는 느낌이 들었다', short:'신뢰' },
];

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
let allFeedback = [];
let canSeeResults = false;
let portalSession = null;

/* ── 렌더링 ── */
const layout = renderPortalLayout({ title: '피처 피드백' });
if (!layout) throw new Error('auth failed');
const { session, bodyEl } = layout;
portalSession = session;

canSeeResults = canAccessFeatureFeedback(session);

bodyEl.innerHTML = `
  <div style="max-width:700px">
    <div class="tab-bar" id="tabBar">
      <button id="tabForm" class="active" onclick="switchTab('form')">✍️ 피드백 남기기</button>
      ${canSeeResults ? `<button id="tabResults" onclick="switchTab('results')">📊 결과 보기</button>` : ''}
    </div>
    <div id="panelForm"></div>
    ${canSeeResults ? `<div id="panelResults" style="display:none"></div>` : ''}
  </div>
`;

function switchTab(tab) {
  document.getElementById('panelForm').style.display    = tab === 'form'    ? '' : 'none';
  const rp = document.getElementById('panelResults');
  if (rp) rp.style.display = tab === 'results' ? '' : 'none';
  document.getElementById('tabForm').classList.toggle('active', tab === 'form');
  const tr = document.getElementById('tabResults');
  if (tr) tr.classList.toggle('active', tab === 'results');
}

/* ── 피드백 폼 ── */
function renderForm() {
  const formShareUrl = `${location.origin}/portal/feature-feedback-form.html`;
  const fp = document.getElementById('panelForm');
  fp.innerHTML = `
    <div style="display:flex;align-items:center;margin-bottom:16px;gap:10px">
      <span style="font-size:13px;color:var(--text-muted)">멤버들에게 설문 링크를 공유하세요</span>
      <button type="button" id="copyFormLinkBtn" style="margin-left:auto;padding:7px 14px;border:1.5px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit">🔗 설문 공유링크 복사</button>
    </div>
    <form id="ffForm" novalidate>
      <div class="ff-card">
        <div class="q-label">발표자 이름<span class="req">*</span></div>
        <select id="presenterSel" style="width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;background:#fff">
          <option value="">-- 선택 --</option>
        </select>
        <div class="err-msg" id="err-presenter">발표자를 선택해 주세요.</div>
      </div>

      ${QUESTIONS.map((q,i) => `
        <div class="ff-card">
          <div class="q-label">${i+1}. ${q.text}<span class="req">*</span></div>
          <div class="star-group">
            ${[5,4,3,2,1].map(v=>`
              <label for="${q.key}-${v}">★</label>
              <input type="radio" name="${q.key}" id="${q.key}-${v}" value="${v}">`).join('')}
          </div>
          <div class="star-hint">1점(별로) ~ 5점(매우 그렇다)</div>
          <div class="err-msg" id="err-${q.key}">별점을 선택해 주세요.</div>
        </div>
      `).join('')}

      <div class="ff-card">
        <div class="q-label">자유 의견 <span style="font-weight:400;color:var(--text-muted)">(선택)</span></div>
        <textarea id="commentField" rows="3"
          style="width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;font-size:14px;font-family:inherit;resize:vertical"
          placeholder="인상 깊었던 점, 개선하면 좋을 점 등"></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">피드백 제출하기</button>
    </form>
  `;

  // 설문 공유링크 복사 버튼
  document.getElementById('copyFormLinkBtn')?.addEventListener('click', function() {
    navigator.clipboard.writeText(formShareUrl).then(() => {
      this.textContent = '✅ 복사됨!';
      setTimeout(() => { this.textContent = '🔗 설문 공유링크 복사'; }, 2000);
    });
  });

  // 멤버 목록 로드
  (async () => {
    const sel = document.getElementById('presenterSel');
    try {
      const { data } = await sb.from('members').select('name').eq('is_active', true).order('name');
      const names = (data && data.length) ? data.map(m=>m.name) : MEMBERS_DEFAULT.map(m=>m.name);
      names.forEach(n => { const o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o); });
    } catch {
      MEMBERS_DEFAULT.forEach(m => { const o=document.createElement('option'); o.value=m.name; o.textContent=m.name; sel.appendChild(o); });
    }
  })();

  document.getElementById('ffForm').addEventListener('submit', async e => {
    e.preventDefault();
    let valid = true;

    const presenter = document.getElementById('presenterSel').value;
    const errP = document.getElementById('err-presenter');
    if (!presenter) { errP.classList.add('show'); valid=false; } else errP.classList.remove('show');

    const scores = {};
    QUESTIONS.forEach(q => {
      const checked = document.querySelector(`input[name="${q.key}"]:checked`);
      const errEl = document.getElementById('err-'+q.key);
      if (!checked) { errEl.classList.add('show'); valid=false; }
      else { errEl.classList.remove('show'); scores[q.key] = parseInt(checked.value); }
    });
    if (!valid) return;

    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = '제출 중...';

    const { error } = await sb.from('feature_feedback').insert([{
      presenter_name: presenter,
      comment: document.getElementById('commentField').value.trim() || null,
      ...scores,
    }]);

    if (error) {
      alert('제출 오류: ' + error.message);
      btn.disabled = false; btn.textContent = '피드백 제출하기';
      return;
    }

    btn.textContent = '✅ 제출 완료!';
    setTimeout(() => {
      document.getElementById('ffForm').reset();
      btn.disabled = false; btn.textContent = '피드백 제출하기';
    }, 2000);
  });
}

/* ── 결과 ── */
function avg(arr, key) {
  const vals = arr.map(r=>r[key]).filter(v=>v!=null);
  return vals.length ? vals.reduce((s,v)=>s+v,0)/vals.length : null;
}
function fmt(v) { return v!=null ? v.toFixed(1) : '—'; }
function scoreClass(v) { return v>=4.2?'score-high':v>=3.0?'score-mid':'score-low'; }

function groupByPresenter(data) {
  const map = {};
  data.forEach(r => { if(!map[r.presenter_name]) map[r.presenter_name]=[]; map[r.presenter_name].push(r); });
  return Object.entries(map).sort((a,b) => {
    const sa = QUESTIONS.reduce((s,q)=>{ const v=avg(a[1],q.key); return s+(v||0); }, 0);
    const sb2 = QUESTIONS.reduce((s,q)=>{ const v=avg(b[1],q.key); return s+(v||0); }, 0);
    return sb2 - sa;
  });
}

function renderResults() {
  const rp = document.getElementById('panelResults');
  if (!rp) return;

  rp.innerHTML = `
    <div class="share-bar">
      <select id="pfFilter"><option value="">전체 발표자</option></select>
      <select id="periodFilter">
        <option value="">전체 기간</option>
        <option value="7">최근 7일</option>
        <option value="30">최근 30일</option>
        <option value="90">최근 90일</option>
      </select>
      <span class="pill-count" id="totalCount">—</span>
      <span style="font-size:12px;color:var(--text-muted)">건</span>
    </div>
    <div style="overflow-x:auto;margin-bottom:24px">
      <table class="summary-table" id="summaryTbl"></table>
    </div>
    <div id="detailCards"></div>
  `;

  document.getElementById('pfFilter').addEventListener('change', applyFilters);
  document.getElementById('periodFilter').addEventListener('change', applyFilters);

  loadResults();
}

async function loadResults() {
  const { data } = await sb.from('feature_feedback').select('*').order('created_at', { ascending: false });
  allFeedback = data || [];

  const names = [...new Set(allFeedback.map(r=>r.presenter_name))].sort();
  const sel = document.getElementById('pfFilter');
  if (sel) names.forEach(n => { const o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o); });

  applyFilters();
}

function applyFilters() {
  const presenterVal = document.getElementById('pfFilter')?.value || '';
  const periodVal    = document.getElementById('periodFilter')?.value || '';

  let filtered = allFeedback;
  if (presenterVal) filtered = filtered.filter(r=>r.presenter_name===presenterVal);
  if (periodVal) {
    const cutoff = new Date(Date.now()-parseInt(periodVal)*86400000).toISOString();
    filtered = filtered.filter(r=>r.created_at>=cutoff);
  }

  const tc = document.getElementById('totalCount');
  if (tc) tc.textContent = filtered.length;

  const grouped = groupByPresenter(filtered);
  renderSummaryTable(grouped);
  renderDetailCards(grouped);
}

function renderSummaryTable(grouped) {
  const tbl = document.getElementById('summaryTbl');
  if (!tbl) return;
  if (!grouped.length) { tbl.innerHTML = ''; return; }
  tbl.innerHTML = `
    <thead><tr>
      <th>발표자</th><th>응답</th>
      ${QUESTIONS.map(q=>`<th>${q.short}</th>`).join('')}
      <th>평균</th>
    </tr></thead>
    <tbody>
      ${grouped.map(([name,recs]) => {
        const avgs = QUESTIONS.map(q=>avg(recs,q.key));
        const tot = avgs.filter(v=>v!=null);
        const overall = tot.length ? tot.reduce((s,v)=>s+v,0)/tot.length : null;
        return `<tr>
          <td style="font-weight:700">${name}</td>
          <td>${recs.length}</td>
          ${avgs.map(v=>`<td><span class="score-chip ${scoreClass(v??0)}">${fmt(v)}</span></td>`).join('')}
          <td><span class="score-chip ${scoreClass(overall??0)}" style="font-size:13px">${fmt(overall)}</span></td>
        </tr>`;
      }).join('')}
    </tbody>
  `;
}

function renderDetailCards(grouped) {
  const el = document.getElementById('detailCards');
  if (!el) return;
  el.innerHTML = grouped.map(([name,recs]) => {
    const avgs = QUESTIONS.map(q=>avg(recs,q.key));
    const tot = avgs.filter(v=>v!=null);
    const overall = tot.length ? tot.reduce((s,v)=>s+v,0)/tot.length : null;
    const eid = encodeURIComponent(name);
    return `
      <div class="presenter-card">
        <div class="pc-header">
          <div>
            <div class="pc-name">${name}</div>
            <div class="pc-meta">응답 ${recs.length}건</div>
          </div>
          <div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px">
            <div>
              <div class="pc-avg">${fmt(overall)}</div>
              <div class="pc-avg-sub">종합 / 5.0</div>
            </div>
            <button onclick="copyPresenterLink('${encodeURIComponent(name)}')" style="padding:4px 10px;border:1.5px solid var(--border);border-radius:7px;background:#fff;cursor:pointer;font-size:11px;font-weight:600;font-family:inherit" id="plink-${encodeURIComponent(name)}">🔗 결과 공유</button>
          </div>
        </div>
        ${QUESTIONS.map((q,i) => {
          const v = avgs[i];
          const w = v!=null ? Math.round(v/5*100) : 0;
          return `<div class="q-row">
            <div class="q-row-text">${q.text}</div>
            <div class="q-bar-wrap"><div class="q-bar" style="width:${w}%"></div></div>
            <div class="q-score">${fmt(v)}</div>
          </div>`;
        }).join('')}
        <div class="comment-list">
          <button class="toggle-btn" onclick="toggleResponses(this,'resp-${eid}')">📋 개별 응답 ${recs.length}건 보기</button>
          <div id="resp-${eid}" style="display:none;margin-top:8px">
            ${recs.sort((a,b)=>b.created_at.localeCompare(a.created_at)).map(r=>`
              <div class="comment-item" id="row-${r.id}" style="position:relative">
                <div style="display:flex;align-items:center;margin-bottom:4px">
                  <span class="comment-date">${r.created_at.slice(0,10)}</span>
                  <span style="margin-left:8px;font-size:11px;color:#9ca3af">${QUESTIONS.map(q=>`${q.short.slice(0,2)}:${r[q.key]??'—'}`).join(' / ')}</span>
                  <button onclick="deleteResponse(${r.id})" style="margin-left:auto;background:none;border:none;cursor:pointer;font-size:12px;color:#d1d5db;padding:0 2px" title="삭제">🗑️</button>
                </div>
                ${r.comment ? `<div style="color:#374151">${r.comment}</div>` : '<div style="color:#d1d5db;font-style:italic">코멘트 없음</div>'}
              </div>`).join('')}
          </div>
        </div>
      </div>`;
  }).join('');
}

window.copyPresenterLink = (encodedName) => {
  const name = decodeURIComponent(encodedName);
  const url = `${location.origin}/portal/feature-feedback-results.html?token=${SHARE_TOKEN}&presenter=${encodedName}`;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('plink-'+encodedName);
    if (btn) { btn.textContent = '✅ 복사됨!'; setTimeout(()=>{ btn.textContent='🔗 결과 공유'; }, 2000); }
  });
};

window.toggleResponses = (btn, id) => {
  const el = document.getElementById(id);
  const hidden = el.style.display==='none';
  el.style.display = hidden ? 'block' : 'none';
  const count = el.querySelectorAll('.comment-item').length;
  btn.textContent = hidden ? `📋 개별 응답 접기` : `📋 개별 응답 ${count}건 보기`;
};

window.toggleComments = (btn, id) => {
  const el = document.getElementById('cmt-'+id);
  const hidden = el.style.display==='none';
  el.style.display = hidden ? 'block' : 'none';
  btn.textContent = hidden ? '💬 코멘트 접기' : `💬 코멘트 ${el.querySelectorAll('.comment-item').length}건 보기`;
};

window.deleteResponse = async (id) => {
  if (!confirm('이 응답을 삭제할까요?')) return;
  const { error } = await sb.from('feature_feedback').delete().eq('id', id);
  if (error) { alert('삭제 오류: ' + error.message); return; }
  allFeedback = allFeedback.filter(r => r.id !== id);
  applyFilters();
};

/* ── 초기화 ── */
renderForm();
if (canSeeResults) renderResults();
</script>
</body>
</html>
