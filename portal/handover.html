<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인수인계 — BNI STAR Portal</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/portal/css/portal.css">
  <style>
    /* ── 역할 그리드 ── */
    .role-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
    .role-folder {
      background: #fff; border: 1.5px solid var(--border); border-radius: 14px;
      padding: 20px 18px; cursor: pointer; transition: box-shadow .15s, border-color .15s;
      display: flex; flex-direction: column; gap: 10px;
    }
    .role-folder:hover { box-shadow: 0 4px 14px rgba(0,0,0,.1); border-color: #d1d5db; }
    .rf-icon { font-size: 32px; }
    .rf-name { font-size: 14px; font-weight: 700; line-height: 1.3; }
    .rf-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .rf-count { font-size: 11px; color: var(--text-muted); }
    .rf-status { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 10px; }
    .rf-status.complete { background: #dcfce7; color: #166534; }
    .rf-status.draft    { background: #fef9c3; color: #713f12; }
    .rf-status.empty    { background: #f3f4f6; color: #9ca3af; }

    /* ── 섹션 구분 ── */
    .role-section { margin-bottom: 28px; }
    .role-section-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px;
      color: var(--text-muted); margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
    }
    .role-section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── 상세 뷰 ── */
    .detail-view { display: none; }
    .detail-view.active { display: block; }
    .grid-view.hidden { display: none; }

    .ho-item-card {
      border-left: 4px solid var(--border); padding: 10px 14px; margin-bottom: 10px;
      background: #fafafa; border-radius: 0 8px 8px 0;
    }
    .ho-item-card.decision    { border-color: #2563eb; background: #eff6ff; }
    .ho-item-card.ongoing     { border-color: #ca8a04; background: #fefce8; }
    .ho-item-card.contact     { border-color: #16a34a; background: #f0fdf4; }
    .ho-item-card.resource    { border-color: #8b5cf6; background: #f5f3ff; }
    .ho-item-card.caution     { border-color: #CC0000; background: #fff5f5; }
    .ho-item-card.achievement { border-color: #f59e0b; background: #fffbeb; }
    .ho-item-card { cursor: pointer; transition: box-shadow .12s; }
    .ho-item-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .ho-item-title   { font-size: 13px; font-weight: 600; }
    .ho-item-content { font-size: 12px; color: #6b7280; margin-top: 3px; line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .ho-item-del     { float: right; font-size: 11px; color: #CC0000; cursor: pointer; padding: 2px 6px; }

    .cat-section { margin-bottom: 20px; }
    .cat-section-title { font-size: 12px; font-weight: 700; color: #374151; margin-bottom: 8px; }

    /* ── 임기 탭 바 ── */
    .term-tab-bar {
      display: flex; gap: 0; flex-wrap: wrap; margin-bottom: 0;
      border-bottom: 2px solid var(--border); overflow-x: auto;
    }
    .term-tab-item {
      display: flex; align-items: center; gap: 6px;
      padding: 9px 16px; cursor: pointer; font-size: 12px; font-weight: 500;
      color: var(--text-muted); border-bottom: 2px solid transparent;
      margin-bottom: -2px; white-space: nowrap; transition: color .15s, border-color .15s;
    }
    .term-tab-item:hover { color: #374151; }
    .term-tab-item.active { color: var(--red); border-bottom-color: var(--red); font-weight: 700; }
    .term-tab-del {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border-radius: 50%; border: none; background: transparent;
      color: #9ca3af; font-size: 14px; cursor: pointer; line-height: 1; padding: 0;
      transition: background .12s, color .12s;
    }
    .term-tab-del:hover { background: #fee2e2; color: #CC0000; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/members-data.js"></script>
<script src="/portal/js/portal-auth.js"></script>
<script src="/portal/js/portal-nav.js"></script>
<script>
const CAT_META = {
  decision:    { label: '결정사항',    icon: '🔵' },
  ongoing:     { label: '진행중 업무', icon: '🟡' },
  contact:     { label: '외부 연락처', icon: '📞' },
  resource:    { label: '참고자료',    icon: '🔗' },
  caution:     { label: '주의사항',    icon: '⚠️' },
  achievement: { label: '성과/업적',   icon: '🏆' },
};

const TIER_META = {
  board:      { label: '의장단',       icon: '👑' },
  membership: { label: '멤버십위원회', icon: '🚦' },
  leader:     { label: '리더팀',       icon: '🎓' },
  member:     { label: '일반멤버',     icon: '👤' },
};

// 역할 이름 → 개별 아이콘 (이름 부분 일치)
const ROLE_ICON_MAP = [
  { match: '의장',           icon: '👑' },
  { match: '부의장',         icon: '🤝' },
  { match: 'ST',             icon: '📋' },
  { match: '컨트롤레터',     icon: '✉️' },
  { match: '인터뷰',         icon: '🎤' },
  { match: '커뮤니케이션',   icon: '📢' },
  { match: '트래픽라이트',   icon: '🚦' },
  { match: '도어퍼슨',       icon: '🚪' },
  { match: '비지터',         icon: '👋' },
  { match: '멘토링',         icon: '🌱' },
  { match: '성장',           icon: '📈' },
  { match: '교육',           icon: '📚' },
  { match: '이벤트',         icon: '🎉' },
  { match: 'PR',             icon: '📣' },
  { match: '121',            icon: '☕' },
  { match: '일반멤버',       icon: '👤' },
];

function getRoleIcon(roleName) {
  const found = ROLE_ICON_MAP.find(m => roleName.includes(m.match));
  return found ? found.icon : '📁';
}

const ROLE_ICON = {
  board: '👑', membership: '🚦', leader: '🎓', member: '👤',
};

let allRoles = [], allRecords = [], allItems = [];
let currentSession = null;

document.addEventListener('DOMContentLoaded', async () => {
  const layout = renderPortalLayout({ title: '인수인계' });
  if (!layout) return;
  currentSession = layout.session;
  const { bodyEl } = layout;

  bodyEl.innerHTML = `
    <div class="page-header">
      <div><h1>인수인계</h1><p>역할별 임기 인수인계 기록 — 챕터 기억의 연속성</p></div>
    </div>
    <div class="grid-view" id="gridView">
      <div style="text-align:center;padding:48px;color:#9ca3af">불러오는 중...</div>
    </div>
    <div class="detail-view" id="detailView"></div>
  `;

  await loadAll();
  renderGrid();
});

async function loadAll() {
  const [rolesRes, recordsRes, itemsRes] = await Promise.all([
    getSb().from('roles').select('*').order('tier').order('id'),
    getSb().from('handover_records').select('*').order('term_start', { ascending: false }),
    getSb().from('handover_items').select('*'),
  ]);
  allRoles   = rolesRes.data   || [];
  allRecords = recordsRes.data || [];
  allItems   = itemsRes.data   || [];
}

/* ── 그리드 뷰 ── */
function renderGrid() {
  const el = document.getElementById('gridView');
  el.classList.remove('hidden');
  document.getElementById('detailView').classList.remove('active');

  // 역할 → 최신 handover_record 매핑
  const recordByRole = {};
  allRecords.forEach(r => {
    if (!recordByRole[r.role_id]) recordByRole[r.role_id] = r; // already desc by term_start
  });

  // tier별로 그룹핑 (board → membership → leader)
  const groups = { board: [], membership: [], leader: [] };
  allRoles.filter(r => r.role_type !== 'member').forEach(role => {
    groups[role.role_type]?.push(role);
  });

  const html = Object.entries(groups).map(([type, roles]) => {
    if (!roles.length) return '';
    const meta = TIER_META[type];
    return `
      <div class="role-section">
        <div class="role-section-title">${meta.icon} ${meta.label}</div>
        <div class="role-grid">
          ${roles.map(role => {
            const rec = recordByRole[role.id];
            const itemCount = rec ? allItems.filter(i => i.handover_id === rec.id).length : 0;
            const statusHtml = rec
              ? rec.status === 'complete'
                ? `<span class="rf-status complete">✓ 완료</span>`
                : `<span class="rf-status draft">작성중</span>`
              : `<span class="rf-status empty">미작성</span>`;
            return `
              <div class="role-folder" onclick="openDetail(${role.id})">
                <div class="rf-icon">${getRoleIcon(role.name)}</div>
                <div class="rf-name">${role.name}</div>
                <div class="rf-meta">
                  ${statusHtml}
                  ${rec ? `<span class="rf-count">${itemCount}개 항목</span>` : ''}
                </div>
              </div>`;
          }).join('')}
        </div>
      </div>`;
  }).join('');

  el.innerHTML = html || `<div class="empty-state"><div class="es-icon">🤝</div><p>역할 데이터가 없습니다.<br>Supabase에서 roles-update.sql을 먼저 실행해주세요.</p></div>`;
}

/* ── 상세 뷰 ── */
async function openDetail(roleId) {
  document.getElementById('gridView').classList.add('hidden');
  const detailEl = document.getElementById('detailView');
  detailEl.classList.add('active');
  detailEl.innerHTML = '<div style="text-align:center;padding:48px;color:#9ca3af">불러오는 중...</div>';

  const role = allRoles.find(r => r.id === roleId);
  if (!role) return;

  const canEdit = canManageMembers(currentSession) || currentSession.roleType === role.role_type;

  let records = allRecords.filter(r => r.role_id === roleId)
    .sort((a, b) => b.term_start?.localeCompare(a.term_start || ''));

  let activeRecordId = records[0]?.id || null;

  const renderDetail = () => {
    records = allRecords.filter(r => r.role_id === roleId)
      .sort((a, b) => b.term_start?.localeCompare(a.term_start || ''));
    if (!records.find(r => r.id === activeRecordId)) activeRecordId = records[0]?.id || null;
    const rec  = records.find(r => r.id === activeRecordId);
    const items = rec ? allItems.filter(i => i.handover_id === rec.id) : [];

    detailEl.innerHTML = `
      <!-- 헤더 -->
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap">
        <button class="btn btn-outline btn-sm" id="backBtn">← 목록</button>
        <span style="font-size:20px;font-weight:700">${getRoleIcon(role.name)} ${role.name}</span>
        <span class="badge badge-${role.role_type}">${TIER_META[role.role_type]?.label}</span>
        <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
          ${canEdit ? `<button class="btn btn-outline btn-sm" id="newTermBtn">+ 새 임기</button>` : ''}
          ${canEdit && rec ? `<button class="btn btn-primary btn-sm" id="addItemBtn">+ 항목 추가</button>` : ''}
        </div>
      </div>

      <!-- 임기 탭 바 -->
      ${records.length > 0 ? `
      <div class="term-tab-bar">
        ${records.map(r => {
          const isCurrent = !r.term_end;
          const isActive  = r.id === activeRecordId;
          return `
            <div class="term-tab-item ${isActive ? 'active' : ''}" data-rid="${r.id}">
              <span class="term-tab-label">
                ${isCurrent ? '🟢 ' : ''}${r.term_start || '?'} ~ ${r.term_end || '현재'}
                ${r.status === 'complete' ? ' ✓' : ''}
              </span>
              ${canEdit ? `<button class="term-tab-del" data-rid="${r.id}" title="임기 삭제">×</button>` : ''}
            </div>`;
        }).join('')}
      </div>` : ''}

      <!-- 항목 없을 때 -->
      ${!rec ? `
        <div class="empty-state">
          <div class="es-icon">📂</div>
          <p>아직 인수인계 문서가 없습니다</p>
          ${canEdit ? `<button class="btn btn-primary" style="margin-top:16px" id="newTermBtn2">+ 새 임기 인수인계 만들기</button>` : ''}
        </div>` : ''}

      <!-- 항목 목록 -->
      ${rec ? `
        <div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 12px">
          <span style="font-size:12px;color:#9ca3af">
            ${rec.term_start || '?'} ~ ${rec.term_end || '현재'} &nbsp;·&nbsp;
            ${rec.status === 'complete' ? '✓ 완료' : '작성중'}
          </span>
          ${canEdit && rec.status !== 'complete' ? `<button class="btn btn-secondary btn-sm" id="completeBtn">완료 처리</button>` : ''}
        </div>

        ${Object.entries(CAT_META).map(([cat, meta]) => {
          const catItems = items.filter(i => i.category === cat);
          if (!catItems.length) return '';
          return `
            <div class="cat-section">
              <div class="cat-section-title">${meta.icon} ${meta.label} (${catItems.length})</div>
              ${catItems.map(item => `
                <div class="ho-item-card ${cat}" data-iid="${item.id}">
                  ${canEdit ? `<span class="ho-item-del" data-iid="${item.id}">✕</span>` : ''}
                  <div class="ho-item-title">${item.title}</div>
                  ${item.content ? `<div class="ho-item-content">${item.content}</div>` : ''}
                </div>`).join('')}
            </div>`;
        }).join('')}

        ${items.length === 0 ? `<div class="empty-state"><div class="es-icon">📝</div><p>항목이 없습니다. 항목 추가 버튼을 눌러 작성하세요.</p></div>` : ''}
      ` : ''}
    `;

    // ── 이벤트 바인딩 ──
    detailEl.querySelector('#backBtn')?.addEventListener('click', () => {
      renderGrid();
      document.getElementById('gridView').classList.remove('hidden');
      document.getElementById('detailView').classList.remove('active');
    });
    detailEl.querySelector('#addItemBtn')?.addEventListener('click', () => showAddItemForm(activeRecordId));
    detailEl.querySelector('#newTermBtn')?.addEventListener('click',  () => showNewTermForm(roleId));
    detailEl.querySelector('#newTermBtn2')?.addEventListener('click', () => showNewTermForm(roleId));
    detailEl.querySelector('#completeBtn')?.addEventListener('click', () => markComplete(rec.id));

    // 임기 탭 전환
    detailEl.querySelectorAll('.term-tab-item').forEach(el => {
      el.addEventListener('click', e => {
        if (e.target.classList.contains('term-tab-del')) return;
        activeRecordId = el.dataset.rid;
        renderDetail();
      });
    });

    // 임기 삭제 버튼
    detailEl.querySelectorAll('.term-tab-del').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        deleteTerm(btn.dataset.rid, roleId);
      });
    });

    // 항목 삭제
    detailEl.querySelectorAll('.ho-item-del').forEach(btn => {
      btn.addEventListener('click', e => { e.stopPropagation(); deleteItem(btn.dataset.iid); });
    });

    // 항목 클릭 → 상세 모달
    detailEl.querySelectorAll('.ho-item-card').forEach(card => {
      card.addEventListener('click', e => {
        if (e.target.classList.contains('ho-item-del')) return;
        const item = allItems.find(i => i.id === card.dataset.iid);
        if (item) showItemDetail(item, canEdit);
      });
    });
  };

  window.renderDetail = renderDetail;
  renderDetail();
}

window.openDetail = openDetail;

/* ── 완료 처리 ── */
async function markComplete(recordId) {
  if (!confirm('이 인수인계를 완료 처리하시겠습니까?')) return;
  const { error } = await getSb().from('handover_records').update({ status: 'complete' }).eq('id', recordId);
  if (error) { alert('오류: ' + error.message); return; }
  await loadAll();
  const rec = allRecords.find(r => r.id === recordId);
  if (rec) openDetail(rec.role_id);
}
window.markComplete = markComplete;

/* ── 임기 삭제 ── */
async function deleteTerm(recordId, roleId) {
  if (!confirm('이 임기와 모든 항목을 삭제하시겠습니까?\n되돌릴 수 없습니다.')) return;
  // handover_items는 ON DELETE CASCADE이므로 record만 삭제
  const { error } = await getSb().from('handover_records').delete().eq('id', recordId);
  if (error) { alert('오류: ' + error.message); return; }
  await loadAll();
  openDetail(roleId);
}
window.deleteTerm = deleteTerm;

/* ── 항목 삭제 ── */
async function deleteItem(itemId) {
  if (!confirm('이 항목을 삭제하시겠습니까?')) return;
  const { error } = await getSb().from('handover_items').delete().eq('id', itemId);
  if (error) { alert('오류: ' + error.message); return; }
  await loadAll();
  window.renderDetail?.();
}
window.deleteItem = deleteItem;

/* ── 항목 추가 폼 ── */
function showAddItemForm(handoverId) {
  const modal = createModal(`
    <h2 style="font-size:16px;font-weight:700;margin-bottom:20px">항목 추가</h2>
    <div class="form-group">
      <label class="form-label">유형</label>
      <select id="addCat" class="form-input">
        ${Object.entries(CAT_META).map(([c,m]) => `<option value="${c}">${m.icon} ${m.label}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">제목</label>
      <input type="text" id="addTitle" class="form-input" placeholder="항목 제목">
    </div>
    <div class="form-group">
      <label class="form-label">내용 (선택)</label>
      <textarea id="addContent" class="form-input" rows="3" placeholder="상세 내용"></textarea>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-outline" id="modalCancel">취소</button>
      <button class="btn btn-primary" id="modalConfirm">추가</button>
    </div>`);

  modal.querySelector('#modalCancel').addEventListener('click', () => modal.remove());
  modal.querySelector('#modalConfirm').addEventListener('click', async () => {
    const category = modal.querySelector('#addCat').value;
    const title    = modal.querySelector('#addTitle').value.trim();
    const content  = modal.querySelector('#addContent').value.trim() || null;
    if (!title) return;
    const { error } = await getSb().from('handover_items').insert({ handover_id: handoverId, category, title, content });
    if (error) { alert('오류: ' + error.message); return; }
    modal.remove();
    await loadAll();
    window.renderDetail?.();
  });
}

/* ── 새 임기 추가 폼 ── */
function showNewTermForm(roleId) {
  const modal = createModal(`
    <h2 style="font-size:16px;font-weight:700;margin-bottom:20px">새 임기 인수인계 만들기</h2>
    <div class="form-row2">
      <div class="form-group">
        <label class="form-label">임기 시작</label>
        <input type="date" id="termStart" class="form-input" value="${new Date().toISOString().slice(0,10)}">
      </div>
      <div class="form-group">
        <label class="form-label">임기 종료 (선택)</label>
        <input type="date" id="termEnd" class="form-input">
      </div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:4px">
      <button class="btn btn-outline" id="modalCancel">취소</button>
      <button class="btn btn-primary" id="modalConfirm">만들기</button>
    </div>`);

  modal.querySelector('#modalCancel').addEventListener('click', () => modal.remove());
  modal.querySelector('#modalConfirm').addEventListener('click', async () => {
    const term_start = modal.querySelector('#termStart').value;
    const term_end   = modal.querySelector('#termEnd').value || null;
    if (!term_start) return;
    const { data, error } = await getSb().from('handover_records')
      .insert({ role_id: roleId, term_start, term_end, status: 'draft' }).select().single();
    if (error) { alert('오류: ' + error.message); return; }
    modal.remove();
    await loadAll();
    openDetail(roleId);
  });
}

/* ── 항목 상세 모달 ── */
function showItemDetail(item, canEdit) {
  const meta = CAT_META[item.category] || { label: item.category, icon: '📌' };
  const modal = createModal(`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
      <span style="font-size:18px">${meta.icon}</span>
      <span style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.5px">${meta.label}</span>
    </div>
    ${canEdit ? `
      <div class="form-group">
        <label class="form-label">제목</label>
        <input id="itemEditTitle" class="form-input" value="${item.title.replace(/"/g,'&quot;')}">
      </div>
      <div class="form-group">
        <label class="form-label">내용</label>
        <textarea id="itemEditContent" class="form-input" rows="5">${item.content || ''}</textarea>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-outline" id="modalCancel">닫기</button>
        <button class="btn btn-primary" id="modalSave">저장</button>
      </div>
    ` : `
      <div style="font-size:15px;font-weight:700;margin-bottom:10px">${item.title}</div>
      ${item.content ? `<div style="font-size:13px;color:#374151;line-height:1.7;white-space:pre-wrap">${item.content}</div>` : '<div style="font-size:13px;color:#9ca3af">내용 없음</div>'}
      <div style="display:flex;justify-content:flex-end;margin-top:20px">
        <button class="btn btn-outline" id="modalCancel">닫기</button>
      </div>
    `}
  `);

  modal.querySelector('#modalCancel').addEventListener('click', () => modal.remove());
  modal.querySelector('#modalSave')?.addEventListener('click', async () => {
    const title   = modal.querySelector('#itemEditTitle').value.trim();
    const content = modal.querySelector('#itemEditContent').value.trim() || null;
    if (!title) return;
    const { error } = await getSb().from('handover_items').update({ title, content }).eq('id', item.id);
    if (error) { alert('오류: ' + error.message); return; }
    modal.remove();
    await loadAll();
    window.renderDetail?.();
  });
}

/* ── 모달 헬퍼 ── */
function createModal(innerHtml) {
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px';
  modal.innerHTML = `<div style="background:#fff;border-radius:14px;padding:28px;width:100%;max-width:460px">${innerHtml}</div>`;
  document.body.appendChild(modal);
  return modal;
}
</script>
